<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>위베이프 직원 스케줄</title>
<style>
  :root{
    --head:#2b2d42; --sat:#8fbaff; --sun:#ff9d9d;
    --off:#f1f1f1; --hol:#fce4ec; --holT:#c62828;
    --vac:#ffc7ce; --vacT:#9c0006; --train:#ffe9c9; --trip:#ddebf7;
    --sick:#e7dcff; --sickT:#4b2ea6;
    --line:#e2e2e6; --ink:#22232b; --muted:#8a8b93;
  }
  *{box-sizing:border-box}
  html,body{margin:0;background:#f5f6f8;color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Malgun Gothic","Apple SD Gothic Neo",sans-serif;
    -webkit-text-size-adjust:100%}
  .wrap{max-width:100%;padding:14px 10px 40px}
  .top{display:flex;align-items:baseline;justify-content:space-between;gap:8px;margin:2px 4px 10px;flex-wrap:wrap}
  h1{font-size:19px;margin:0;font-weight:800;letter-spacing:-.3px}
  .sub{font-size:11.5px;color:var(--muted)}
  #monthSel{font-size:13px;font-weight:700;padding:3px 7px;border:1px solid var(--line);border-radius:7px;background:#fff;color:#222;margin-right:6px}
  .legend{display:flex;flex-wrap:wrap;gap:8px 12px;margin:0 4px 10px;font-size:11.5px;color:#444}
  .legend .lg{display:inline-flex;align-items:center;gap:5px}
  .legend i{width:13px;height:13px;border-radius:3px;border:1px solid rgba(0,0,0,.08);display:inline-block}
  .scroll{overflow:auto;border:1px solid var(--line);border-radius:12px;background:#fff;
    -webkit-overflow-scrolling:touch;max-height:82vh}
  table{border-collapse:separate;border-spacing:0;font-size:13.5px;white-space:nowrap;min-width:100%}
  th,td{border-right:1px solid var(--line);border-bottom:1px solid var(--line);
    padding:8px 6px;text-align:center;vertical-align:middle}
  thead th{position:sticky;top:0;z-index:3;background:var(--head);color:#fff;font-weight:700;
    font-size:13px;line-height:1.15;padding:8px 5px}
  thead th small{font-weight:600;font-size:11px;opacity:.9}
  thead th.sat{color:var(--sat)} thead th.sun{color:var(--sun)}
  .namecol{position:sticky;left:0;z-index:2;background:#fafafb;text-align:left;
    min-width:88px;padding-left:11px;box-shadow:1px 0 0 var(--line)}
  thead .namecol{z-index:5;background:var(--head)}
  tbody .namecol b{font-size:14.5px}
  tbody .namecol .ttl{display:block;font-size:11px;color:var(--muted);font-weight:600}
  .homecol{position:sticky;left:88px;z-index:2;background:#fafafb;min-width:60px;
    font-size:12px;color:#555;box-shadow:1px 0 0 var(--line)}
  thead .homecol{z-index:5;background:var(--head);color:#fff}
  td.day{min-width:46px;font-weight:600}
  .opcl{font-size:8.5px;vertical-align:super;margin-left:1px;opacity:.7}
  td.off{background:var(--off);color:transparent}
  td.hol{background:var(--hol);color:var(--holT);font-weight:800;font-size:10.5px}
  td.vac{background:var(--vac);color:var(--vacT);font-weight:700}
  td.train{background:var(--train)}
  td.trip{background:var(--trip)}
  td.sick{background:var(--sick);color:var(--sickT);font-weight:800;font-size:10.5px}
  td.sum{background:#fafafb;font-weight:700;color:#444;font-size:11px}
  tbody tr:last-child td{border-bottom:none}
  tbody .namecol{cursor:pointer}
  #schedTable.has-sel tbody tr:not(.sel){opacity:.28}
  #schedTable tbody tr.sel .namecol{background:#fff3d6}
  #schedTable tbody tr.sel td.off{background:#ffcf99;color:#7a3e00;font-weight:800}
  #schedTable tbody tr.sel td.off::after{content:'휴무';font-size:11px}
  .state{padding:40px 16px;text-align:center;color:var(--muted);font-size:13.5px;line-height:1.7}
  .state b{color:var(--ink)}
  .foot{margin:12px 4px 0;font-size:11px;color:var(--muted);text-align:center}
  .hint{font-size:12px;color:var(--muted);margin:0 4px 7px;text-align:center;display:none}
  .err{color:#b3261e}
  /* 모바일: 한 달 전체를 화면 폭에 맞춰 보여주고, 손가락으로 확대해서 보기 */
  @media(max-width:720px){
    .hint{display:block}
    .wrap{padding:12px 6px 32px}
    .scroll{overflow-x:hidden;max-height:none;border-radius:8px}
    table{min-width:0;width:100%;table-layout:fixed;font-size:8px}
    th,td{padding:2px 1px;border-right:1px solid #eee;border-bottom:1px solid #eee}
    thead th{font-size:8px;padding:3px 1px}
    thead th small{font-size:6.5px}
    td.day{min-width:0;font-weight:600}
    .namecol,thead .namecol{position:static;min-width:0;padding-left:3px;box-shadow:none;width:9%}
    .homecol,thead .homecol{position:static;min-width:0;box-shadow:none;width:8%}
    tbody .namecol b{font-size:8.5px}
    tbody .namecol .ttl{display:none}
    .opcl{font-size:6px}
    td.hol,td.vac,td.train,td.trip,td.sick{font-size:7px}
    td.sum{font-size:8px}
    #schedTable tbody tr.sel td.off::after{font-size:7px}
  }
</style>
<script src="https://cdn.jsdelivr.net/npm/xlsx-js-style@1.2.0/dist/xlsx.bundle.js"></script>
<script>
/* ===== 로딩 속도 개선 =====
   1) 시트 호출(달 목록·스케줄·공지)을 mode=all 한 번으로 합친다.
      fetch를 가로채는 방식이라 아래쪽 코드는 한 줄도 고치지 않는다.
      반드시 head에 두어야 첫 호출까지 잡을 수 있다.
   2) 마지막에 본 데이터를 브라우저에 저장해 두었다가 다음 접속 때 즉시 표시하고,
      뒤에서 조용히 갱신한 뒤 달라졌을 때만 다시 그린다. */
(function(){
  if(window.__wvSpeed) return; window.__wvSpeed = true;
  var LS = 'wvBundle_v1';
  var _f = window.fetch.bind(window);
  var mem = {}, inflight = {}, apiBase = '', forceFresh = false, revalidated = false;

  function isApi(u){ return String(u).indexOf('/macros/s/') >= 0; }
  function base(u){ var i = String(u).indexOf('?'); return i < 0 ? String(u) : String(u).slice(0, i); }
  function qs(u, k){
    var i = String(u).indexOf('?'); if(i < 0) return '';
    var parts = String(u).slice(i + 1).split('&');
    for(var j = 0; j < parts.length; j++){
      var p = parts[j].split('=');
      if(decodeURIComponent(p[0]) === k) return decodeURIComponent((p[1] || '').replace(/\+/g, ' '));
    }
    return '';
  }
  function readLS(){ try{ return JSON.parse(localStorage.getItem(LS) || 'null'); }catch(e){ return null; } }
  function writeLS(b){ try{ localStorage.setItem(LS, JSON.stringify(b)); }catch(e){} }
  function put(b, k){ if(!b) return; mem[k || ''] = b; if(b.month) mem[b.month] = b; }

  function pull(month, fresh){
    if(!apiBase) return Promise.reject(new Error('no base'));
    var u = apiBase + '?mode=all' + (month ? ('&month=' + encodeURIComponent(month)) : '')
          + (fresh ? '&fresh=1' : '') + '&t=' + Date.now();
    return _f(u, {cache:'no-store'}).then(function(r){ return r.text(); }).then(function(t){
      var b = JSON.parse(t);
      if(!b || typeof b.csv !== 'string') throw new Error('bad bundle');
      return b;
    });
  }
  function getAll(month){
    var k = month || '';
    if(!forceFresh && mem[k]) return Promise.resolve(mem[k]);
    if(inflight[k]) return inflight[k];
    var wasFresh = forceFresh;
    var p = pull(month, wasFresh).then(function(b){
      put(b, k); writeLS(b);
      delete inflight[k]; if(wasFresh) forceFresh = false;
      return b;
    }, function(e){ delete inflight[k]; throw e; });
    inflight[k] = p; return p;
  }
  function reply(text){
    return new Response(text, {status:200, headers:{'Content-Type':'text/plain; charset=utf-8'}});
  }

  window.fetch = function(input, init){
    var url = (typeof input === 'string') ? input : ((input && input.url) || '');
    if(!isApi(url)) return _f(input, init);
    if(!apiBase) apiBase = base(url);
    var method = ((init && init.method) || (input && input.method) || 'GET').toUpperCase();
    if(method !== 'GET'){
      mem = {}; inflight = {}; forceFresh = true;
      try{ localStorage.removeItem(LS); }catch(e){}
      return _f(input, init);
    }
    var mode = qs(url, 'mode'), month = qs(url, 'month');
    if(mode === 'revs' || mode === 'diag' || mode === 'all' || mode === 'cfg') return _f(input, init);
    return getAll(month).then(function(b){
      if(mode === 'list')   return reply(JSON.stringify(b.months || []));
      if(mode === 'notice') return reply(String(b.notice == null ? '' : b.notice));
      return reply(String(b.csv == null ? '' : b.csv));
    })['catch'](function(){ return _f(input, init); });
  };

  /* 저장해 둔 데이터가 있으면 그것으로 즉시 그리고, 뒤에서 최신본을 받아 비교한다 */
  var cached = readLS();
  if(cached && cached.csv){
    put(cached, '');
    var tries = 0;
    var timer = setInterval(function(){
      tries++;
      if(!apiBase){ if(tries > 60) clearInterval(timer); return; }
      clearInterval(timer);
      if(revalidated) return; revalidated = true;
      pull('', false).then(function(b){
        var old = mem[''];
        if(old && old.csv === b.csv && old.notice === b.notice){ put(b, ''); writeLS(b); return; }
        mem = {}; inflight = {}; put(b, ''); writeLS(b);
        var sel = document.getElementById('monthSel');
        var keep = sel ? sel.value : '';
        try{
          if(keep && keep !== b.month && typeof loadMonth === 'function') loadMonth(keep);
          else if(typeof load === 'function') load();
        }catch(e){}
      })['catch'](function(){});
    }, 100);
  }
})();
</script>
</head>
<body>
<div class="wrap">
  <div class="top">
    <h1 id="title">위베이프 직원 스케줄</h1>
    <span class="sub"><select id="monthSel" style="display:none"></select><span id="stamp"></span></span>
  </div>
  <div class="legend" id="legend"></div>
  <div class="hint">두 손가락으로 확대해서 보세요 · 이름을 누르면 그 사람 휴무가 강조됩니다</div>
  <div class="scroll" id="board">
    <div class="state">불러오는 중…</div>
  </div>
  <div class="foot" id="foot"></div>
</div>

<script>
/* ============================================================
   설정 — 여기 한 줄만 실장님 구글시트 주소로 바꾸세요.
   구글시트 → 파일 → 공유 → 웹에 게시 → "쉼표로 구분된 값(.csv)"
   으로 게시하고 나온 주소를 아래 따옴표 안에 붙여넣으면 됩니다.
   ============================================================ */
const WEBAPP_URL = "https://script.google.com/macros/s/AKfycbxTkORMjTnG904crrghKNmEA2laN4WcVUpDItmbNuwArjRWlkpaZZOoxcFkTyHfBC1f/exec";

/* ---- 색상 (엑셀/생성기와 동일) ---- */
const STORE_PALETTE=['#ffe9ec','#fff3d6','#e3f2fd','#e8f5e9','#f3e5f5','#e0f7fa','#fff8e1','#efebe9','#ede7f6','#f1f8e9','#fde2ff','#e2fff3'];
const DAYNAMES=['일','월','화','수','목','금','토'];

/* ---- CSV 파서 (따옴표·줄바꿈 처리) ---- */
function parseCSV(text){
  const rows=[]; let row=[], cur='', q=false;
  text=text.replace(/\r\n/g,'\n').replace(/\r/g,'\n');
  for(let i=0;i<text.length;i++){
    const c=text[i];
    if(q){
      if(c==='"'){ if(text[i+1]==='"'){cur+='"';i++;} else q=false; }
      else cur+=c;
    }else{
      if(c==='"') q=true;
      else if(c===','){ row.push(cur); cur=''; }
      else if(c==='\n'){ row.push(cur); rows.push(row); row=[]; cur=''; }
      else cur+=c;
    }
  }
  row.push(cur); rows.push(row);
  return rows.filter(r=>r.some(x=>String(x).trim()!==''));
}

/* ---- 셀 종류 판정 ---- */
function classify(v){
  v=(v==null?'':String(v)).trim();
  if(v==='') return {cls:'off',txt:''};
  if(v==='전���무') return {cls:'hol',txt:'전휴무'};
  if(v==='휴가') return {cls:'vac',txt:'휴가'};
  if(v==='훈련') return {cls:'train',txt:'훈련'};
  if(v==='병가') return {cls:'sick',txt:'병가'};
  if(v==='출장') return {cls:'trip',txt:'출장'};
  const m=v.match(/^(.+?)\((OP|CL)\)$/);
  const base=m?m[1].trim():v;
  return {cls:'store',base:base,txt:base,opcl:m?m[2]:''};
}

function esc(s){return String(s==null?'':s).replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));}

function render(rows){
  let title='위베이프 직원 스케줄';
  outer: for(const r of rows){ for(const c of r){ if(String(c).trim()){ title=String(c).trim(); break outer; } } }
  let hi=rows.findIndex(r=>r.some(c=>String(c).trim()==='성명'));
  if(hi<0) throw new Error('표 형식을 찾지 못했습니다. 생성기에서 내보낸 형식(소속·성명·직책·구분)이어야 합니다.');
  const head=rows[hi].map(c=>String(c).trim());
  const week=(rows[hi+1]||[]).map(c=>String(c).trim());
  const nameCol=head.indexOf('성명');
  const titleCol=head.indexOf('직책');
  const homeCol=head.indexOf('구분');
  const offCol=head.indexOf('휴무');
  const vacCol=head.findIndex(c=>c.replace(/\s/g,'').startsWith('휴가'));
  const dayCols=[];
  head.forEach((c,idx)=>{ if(/^\d{1,2}$/.test(c)) dayCols.push(idx); });
  const colorOf={}; let ci=0;
  const storeColor=name=>{ if(!(name in colorOf)){ colorOf[name]=STORE_PALETTE[ci%STORE_PALETTE.length]; ci++; } return colorOf[name]; };
  const emps=rows.slice(hi+2).filter(r=>String(r[nameCol]||'').trim()!=='');
  emps.forEach(r=>dayCols.forEach(dc=>{ const k=classify(r[dc]); if(k.cls==='store') storeColor(k.base); }));
  let h='<table id="schedTable"><thead><tr>';
  h+='<th class="namecol">성명</th><th class="homecol">소속</th>';
  dayCols.forEach(dc=>{
    const d=head[dc]; const w=week[dc]||'';
    const cls=w==='토'?'sat':w==='일'?'sun':'';
    h+=`<th class="${cls}">${esc(d)}<br><small>${esc(w)}</small></th>`;
  });
  h+='<th>휴무</th><th>휴가<br>훈련</th></tr></thead><tbody>';
  emps.forEach(r=>{
    const nm=String(r[nameCol]||'').trim();
    const tt=titleCol>=0?String(r[titleCol]||'').trim():'';
    const hm=homeCol>=0?String(r[homeCol]||'').trim():'';
    let offN=0,vacN=0;
    h+=`<tr><td class="namecol" onclick="selEmp(this)"><b>${esc(nm)}</b>${tt?`<span class="ttl">${esc(tt)}</span>`:''}</td><td class="homecol">${esc(hm)}</td>`;
    dayCols.forEach(dc=>{
      const k=classify(r[dc]);
      if(k.cls==='off'){ offN++; h+='<td class="day off"></td>'; }
      else if(k.cls==='hol'){ h+='<td class="day hol">전휴무</td>'; }
      else if(k.cls==='vac'){ vacN++; h+='<td class="day vac">휴가</td>'; }
      else if(k.cls==='train'){ vacN++; h+='<td class="day train">훈련</td>'; }
      else if(k.cls==='sick'){ vacN++; h+='<td class="day sick">병가</td>'; }
      else if(k.cls==='trip'){ h+='<td class="day trip">출장</td>'; }
      else{ h+=`<td class="day store" style="background:${storeColor(k.base)}">${esc(k.txt)}${k.opcl?`<span class="opcl">${k.opcl}</span>`:''}</td>`; }
    });
    const offShown = offCol>=0 && String(r[offCol]||'').trim()!=='' ? String(r[offCol]).trim() : offN;
    const vacShown = vacCol>=0 && String(r[vacCol]||'').trim()!=='' ? String(r[vacCol]).trim() : vacN;
    h+=`<td class="sum">${esc(offShown)}</td><td class="sum">${esc(vacShown)}</td></tr>`;
  });
  h+='</tbody></table>';
  document.getElementById('title').textContent=title;
  document.getElementById('board').innerHTML=h;
  const legs=Object.keys(colorOf).map(n=>`<span class="lg"><i style="background:${colorOf[n]}"></i>${esc(n)}</span>`).join('')
    +'<span class="lg"><i style="background:var(--off)"></i>휴무</span>'
    +'<span class="lg"><i style="background:var(--hol)"></i>전휴무</span>'
    +'<span class="lg"><i style="background:var(--vac)"></i>휴가</span>'
    +'<span class="lg"><i style="background:var(--train)"></i>훈련</span>'
    +'<span class="lg"><i style="background:var(--sick)"></i>병가</span>'
    +'<span class="lg"><i style="background:var(--trip)"></i>출장</span>';
  document.getElementById('legend').innerHTML=legs;
}

function selEmp(td){
  const tr=td.closest('tr'); if(!tr) return;
  const tbl=document.getElementById('schedTable'); if(!tbl) return;
  const was=tr.classList.contains('sel');
  tbl.querySelectorAll('tr.sel').forEach(x=>x.classList.remove('sel'));
  if(was){ tbl.classList.remove('has-sel'); }
  else{ tr.classList.add('sel'); tbl.classList.add('has-sel'); }
}

function showError(msg){
  document.getElementById('board').innerHTML=`<div class="state err">${esc(msg)}</div>`;
}

async function loadMonth(m){
  try{
    const res=await fetch(WEBAPP_URL+'?month='+encodeURIComponent(m||'')+'&t='+Date.now());
    if(!res.ok) throw new Error('데이터를 뱼렼오지 못했습니다 ('+res.status+').');
    render(parseCSV(await res.text()));
    const now=new Date(); const p=n=>String(n).padStart(2,'0');
    document.getElementById('stamp').textContent=`열만 ${now.getFullYear()}.${p(now.getMonth()+1)}.${p(now.getDate())} ${p(now.getHours())}:${p(now.getMinutes())}`;
    document.getElementById('foot').textContent='이름을 누르면 그 사람 휴무가 강조됩니다(다시 누르면 해제). 위에서 달을 바꾸면 지난달도 볼 수 있어요.';
  }catch(e){ showError(e.message||'불러오기 오류'); }
}
async function load(){
  try{
    const lr=await fetch(WEBAPP_URL+'?mode=list&t='+Date.now());
    let months=[]; try{ months=JSON.parse(await lr.text()); }catch(_){}
    const sel=document.getElementById('monthSel');
    if(months && months.length){
      sel.innerHTML=months.map(m=>`<option value="${m}">${esc(m.replace('-','년 ')+'월')}</option>`).join('');
      sel.style.display='';
      sel.onchange=()=>loadMonth(sel.value);
      await loadMonth(months[0]);
    }else{
      sel.style.display='none';
      await loadMonth('');
    }
  }catch(e){ showError('연결 오류: '+(e.message||e)); }
}
load();
</script>

<script>
/* 병가 열 표시 수정 + 매장 색상 복원: 시트 집계열 그대로 렌더(2열/3열 자동), 매장별 배경색 자체 팔레트 적용 */
render = function(rows){
  var board=document.getElementById('board');
  if(!rows||!rows.length){ board.innerHTML=''; return; }
  var PAL=['#ffe9ec','#fff3d6','#e3f2fd','#e8f5e9','#f3e5f5','#e0f7fa','#fff8e1','#efebe9','#ede7f6','#f1f8e9','#fde2ff','#e2fff3'];
  var cmap={}, pci=0; function scolor(n){ if(!(n in cmap)){ cmap[n]=PAL[pci%PAL.length]; pci++; } return cmap[n]; }

<script>
/* ===== 엑셀 사본 저장 (파일명: YYYY년 M월 직원 스케줄.xlsx) ===== */
(function(){
  var PAL = ['ffe9ec','fff3d6','e3f2fd','e8f5e9','f3e5f5','e0f7fa','fff8e1','efebe9','ede7f6','f1f8e9','fde2ff','e2fff3'];
  var SPECIAL = { '전휴무':'FCE4EC', '휴가':'FFC7CE', '훈련':'FFE9C9', '병가':'E7DCFF', '출장':'DDEBF7' };

  // 원본 데이터 보관 (render를 한 겹 더 감싼다)
  if(typeof render === 'function' && !render.__wvdl){
    var _r = render;
    var w = function(rows){ try{ window.__wvRows = rows; }catch(e){} var out = _r.apply(this, arguments); try{ wvAddBtn(); }catch(e){} return out; };
    w.__wvdl = true; render = w;
  }

  function wvAddBtn(){
    if(document.getElementById('wvDl')) return;
    var stamp = document.getElementById('stamp');
    if(!stamp || !stamp.parentNode) return;
    var b = document.createElement('button');
    b.id = 'wvDl'; b.type = 'button'; b.textContent = '엑셀 저장';
    b.style.cssText = 'margin-right:6px;padding:3px 9px;font-size:12px;font-weight:700;border:1px solid var(--line);border-radius:7px;background:#fff;color:#333;cursor:pointer';
    b.addEventListener('click', wvDownload);
    stamp.parentNode.insertBefore(b, stamp);
  }

  function wvDownload(){
    var rows = window.__wvRows;
    if(!rows || !rows.length){ alert('아직 스케줄을 불러오지 못했습니다. 잠시 후 다시 눌러주세요.'); return; }
    if(typeof XLSX === 'undefined'){ alert('엑셀 모듈을 불러오지 못했습니다. 새로고침 후 다시 시도해주세요.'); return; }
    var aoa = rows.map(function(r){ return r.map(function(c){ return String(c == null ? '' : c); }); });
    var hi = -1;
    for(var i = 0; i < aoa.length; i++){ if(aoa[i].some(function(x){ return x.trim() === '성명'; })){ hi = i; break; } }
    if(hi < 0) hi = 1;
    var header = aoa[hi];
    var nameCol = header.map(function(x){ return x.trim(); }).indexOf('성명');
    if(nameCol < 0) nameCol = 1;
    var dayIdx = [];
    for(var c = 0; c < header.length; c++) if(/^\d{1,2}$/.test(header[c].trim())) dayIdx.push(c);
    var firstDay = dayIdx.length ? dayIdx[0] : nameCol + 3;
    var lastDay  = dayIdx.length ? dayIdx[dayIdx.length - 1] : header.length - 1;
    var maxc = Math.max.apply(null, aoa.map(function(r){ return r.length; }));

    var cmap = {}, pci = 0;
    function scolor(n){ if(!(n in cmap)){ cmap[n] = PAL[pci % PAL.length].toUpperCase(); pci++; } return cmap[n]; }
    aoa.slice(hi + 2).forEach(function(r){
      dayIdx.forEach(function(c){
        var v = (r[c] || '').trim().replace(/\((OP|CL)\)$/, '').trim();
        if(v && !SPECIAL[v]) scolor(v);
      });
    });

    var ws = XLSX.utils.aoa_to_sheet(aoa);
    ws['!cols'] = Array.apply(null, { length: maxc }).map(function(_, i){
      return { wch: i < firstDay ? 9 : (i > lastDay ? 8 : 5.5) };
    });
    var bd = { style: 'thin', color: { rgb: 'D9D9D9' } };
    var border = { top: bd, bottom: bd, left: bd, right: bd };
    for(var r2 = 0; r2 < aoa.length; r2++){
      for(var c2 = 0; c2 < maxc; c2++){
        var ref = XLSX.utils.encode_cell({ r: r2, c: c2 });
        if(!ws[ref]) ws[ref] = { t: 's', v: '' };
        var st = { border: border, alignment: { horizontal: 'center', vertical: 'center', wrapText: true }, font: { sz: 10 } };
        var v2 = String(ws[ref].v == null ? '' : ws[ref].v).trim();
        if(r2 < hi){ st.font = { sz: 14, bold: true }; st.alignment = { horizontal: 'left', vertical: 'center' }; }
        else if(r2 === hi || r2 === hi + 1){
          st.fill = { fgColor: { rgb: '2B2D42' } };
          st.font = { sz: 10, bold: true, color: { rgb: 'FFFFFF' } };
          if(r2 === hi + 1 && v2 === '토') st.font.color = { rgb: '8FBAFF' };
          if(r2 === hi + 1 && v2 === '일') st.font.color = { rgb: 'FF9D9D' };
        }
        else if(c2 < firstDay){ st.fill = { fgColor: { rgb: 'FAFAFB' } }; if(c2 === nameCol) st.font = { sz: 10, bold: true }; }
        else if(c2 > lastDay){ st.fill = { fgColor: { rgb: 'FAFAFB' } }; st.font = { sz: 10, bold: true }; }
        else {
          var base = v2.replace(/\((OP|CL)\)$/, '').trim();
          if(v2 === '') st.fill = { fgColor: { rgb: 'F1F1F1' } };
          else if(SPECIAL[base]) st.fill = { fgColor: { rgb: SPECIAL[base] } };
          else if(base) st.fill = { fgColor: { rgb: scolor(base) } };
        }
        ws[ref].s = st;
      }
    }
    if(aoa[0] && aoa[0][0]) ws['!merges'] = [{ s: { r: 0, c: 0 }, e: { r: 0, c: maxc - 1 } }];
    ws['!rows'] = aoa.map(function(_, r3){ return { hpt: r3 === 0 ? 26 : (r3 <= hi + 1 ? 17 : 20) }; });

    var wb = XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(wb, ws, '스케줄');

    var t = (aoa[0] && aoa[0][0] ? aoa[0][0].trim() : ''), name;
    if(/직원\s*스케줄/.test(t)) name = t;
    else {
      var sel = document.getElementById('monthSel');
      var p = String(sel && sel.value ? sel.value : '').split('-');
      name = (p.length === 2) ? (p[0] + '년 ' + parseInt(p[1], 10) + '월 직원 스케줄') : '직원 스케줄';
    }
    XLSX.writeFile(wb, name + '.xlsx');
  }

  window.wvDownload = wvDownload;
  try{ wvAddBtn(); }catch(e){}
})();
</script>
<script>

  var SPECIAL = ['전휴무','휴가','훈련','병가','출장'];   // 근무로 세지 않는 값

  function sha(t){
    var b = new TextEncoder().encode(t);
    return crypto.subtle.digest('SHA-256', b).then(function(d){
      return [].map.call(new Uint8Array(d), function(x){ return x.toString(16).padStart(2,'0'); }).join('');
    });
  }
  function ovClose(){ var o = document.getElementById('wvOv'); if(o) o.remove(); }
  function overlay(html){
    ovClose();
    var d = document.createElement('div'); d.className = 'wvOv'; d.id = 'wvOv';
    d.innerHTML = '<div class="wvCard">' + html + '</div>';
    d.addEventListener('click', function(e){ if(e.target === d) ovClose(); });
    document.body.appendChild(d);
    return d;
  }

  /* ---------- 비밀번호 ---------- */
  function askPw(){
    var d = overlay(
      '<h3>관리자 모드</h3><p>비밀번호를 입력하면 이 화면에서 스케줄을 직접 수정할 수 있습니다.</p>' +
      '<input id="wvApw" class="wvIn" type="password" placeholder="비밀번호" name="wvadm" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false" data-lpignore="true" data-1p-ignore="true">' +
      '<div class="wvErr" id="wvAerr"></div>' +
      '<div class="wvRow"><button class="wvBtn g" id="wvAclr">지우기</button><button class="wvBtn g" id="wvAx">취소</button><button class="wvBtn p" id="wvAok">확인</button></div>'
    );
    var inp = d.querySelector('#wvApw');
    setTimeout(function(){ inp.focus(); }, 120);
    d.querySelector('#wvAclr').onclick = function(){ inp.value = ''; d.querySelector('#wvAerr').textContent = ''; inp.focus(); };
    d.querySelector('#wvAx').onclick = ovClose;
    d.querySelector('#wvAok').onclick = go;
    inp.addEventListener('keydown', function(e){ if(e.key === 'Enter') go(); });
    function go(){
      sha(inp.value).then(function(h){
        if(h === PWHASH){ window.__wvPw = inp.value; ovClose(); startEdit(); }
        else { d.querySelector('#wvAerr').textContent = '비밀번호가 맞지 않습니다.'; inp.value = ''; inp.focus(); }
      });
    }
  }

  /* ---------- 편집 시작 ---------- */
  function meta(rows){
    var hi = -1;
    for(var i = 0; i < rows.length; i++)
      if((rows[i] || []).some(function(x){ return String(x).trim() === '성명'; })){ hi = i; break; }
    if(hi < 0) hi = 1;
    var head = (rows[hi] || []).map(function(x){ return String(x).trim(); });
    var nameCol = head.indexOf('성명'); if(nameCol < 0) nameCol = 1;
    var dayIdx = [];
    for(var c = 0; c < head.length; c++) if(/^\d{1,2}$/.test(head[c])) dayIdx.push(c);
    var st = {};
    for(var r = hi + 2; r < rows.length; r++)
      dayIdx.forEach(function(c){
        var v = String((rows[r] || [])[c] || '').trim().replace(/\((OP|CL)\)$/, '').trim();
        if(v && SPECIAL.indexOf(v) < 0 && NOSTORE.indexOf(v) < 0) st[v] = 1;
      });
    return { hi: hi, head: head, nameCol: nameCol, dayIdx: dayIdx, stores: Object.keys(st).sort() };
  }

  function startEdit(){
    var rows = window.__wvRows;
    if(!rows || !rows.length){ alert('스케줄을 먼저 불러온 뒤 수정할 수 있습니다.'); return; }
    var mt = meta(rows);
    ED = { orig: JSON.parse(JSON.stringify(rows)), rows: JSON.parse(JSON.stringify(rows)),
           hi: mt.hi, dayIdx: mt.dayIdx, nameCol: mt.nameCol, stores: mt.stores, undo: [],
           sumStart: mt.dayIdx[mt.dayIdx.length - 1] + 1,
           sumCols: (function(){
             var h = rows[mt.hi].map(function(x){ return String(x).trim(); });
             var out = [];
             for(var c = mt.dayIdx[mt.dayIdx.length - 1] + 1; c < h.length; c++)
               if(h[c]) out.push({ c: c, key: h[c] });
             return out;
           })() };
    document.body.classList.add('wvEditing');
    tagCells();
    for(var rr = ED.hi + 2; rr < ED.rows.length; rr++) recalcOff(rr);
    bar(true);
  }

  function tagCells(){
    var tbl = document.getElementById('schedTable'); if(!tbl) return;
    var trs = [].slice.call(tbl.querySelectorAll('tr'));
    var body = trs.slice(1);
    for(var i = 0; i < body.length; i++){
      var tds = [].slice.call(body[i].children);
      var rIdx = ED.hi + 2 + i;
      for(var j = 0; j < ED.dayIdx.length; j++){
        var td = tds[j + 2];
        if(!td) continue;
        td.setAttribute('data-r', rIdx);
        td.setAttribute('data-c', ED.dayIdx[j]);
        if(!td.__wvE){ td.__wvE = true; td.addEventListener('click', onCell); }
      }
    }
  }

  /* 직원 추가·수정 블록이 표를 다시 그린 뒤 편집 상태를 되살리기 위한 다리 */
  window.__wvActiveRows = function(){
    return (document.body.classList.contains('wvEditing') && ED && ED.rows) ? ED.rows : window.__wvRows;
  };
  window.__wvSyncEdit = function(rows){
    if(!document.body.classList.contains('wvEditing') || !ED || !ED.rows || !ED.orig) return false;
    var w = (ED.rows[0] || []).length;
    while(ED.orig.length < rows.length){
      var blank = [];
      for(var i = 0; i < w; i++) blank.push('');
      blank[ED.nameCol] = (rows[ED.orig.length] || [])[ED.nameCol] || '';
      ED.orig.push(blank);
    }
    ED.rows = JSON.parse(JSON.stringify(rows));
    tagCells();
    try{ bar(true); }catch(x){}
    return true;
  };

  function onCell(e){
    if(!document.body.classList.contains('wvEditing')) return;
    e.stopPropagation();
    openPick(this);
  }

  function openPick(td){
    var p = document.getElementById('wvPick');
    if(!p){ p = document.createElement('div'); p.id = 'wvPick'; document.body.appendChild(p);
      document.addEventListener('click', function(){ p.style.display = 'none'; }); }
    var opts = ['(휴무)'].concat(NOSTORE).concat(ED.stores).concat(SPECIAL);
    p.innerHTML = opts.map(function(o){ return '<button data-v="' + o + '">' + o + '</button>'; }).join('');
    p.onclick = function(ev){
      var b = ev.target.closest('button'); if(!b) return;
      ev.stopPropagation();
      setCell(td, b.getAttribute('data-v') === '(휴무)' ? '' : b.getAttribute('data-v'));
      p.style.display = 'none';
    };
    var rc = td.getBoundingClientRect();
    p.style.display = 'block';
    var w = p.offsetWidth, h = p.offsetHeight;
    p.style.left = Math.max(6, Math.min(window.innerWidth - w - 6, rc.left)) + 'px';
    p.style.top  = (rc.bottom + h + 10 > window.innerHeight ? Math.max(6, rc.top - h - 4) : rc.bottom + 4) + 'px';
  }

  function color(v){
    var b = String(v).replace(/\((OP|CL)\)$/, '').trim();
    if(!b) return 'var(--off)';
    if(b === '전휴무') return 'var(--hol)';
    if(b === '휴가') return 'var(--vac)';
    if(b === '훈련') return 'var(--train)';
    if(b === '병가') return 'var(--sick)';
    if(b === '출장') return 'var(--trip)';
    if(NOSTORE.indexOf(b) >= 0) return '#eef1f5';
    var i = ED.stores.indexOf(b);
    return i < 0 ? '#fff' : PAL[i % PAL.length];
  }

  function setCell(td, v){
    var r = +td.getAttribute('data-r'), c = +td.getAttribute('data-c');
    var old = String(ED.rows[r][c] == null ? '' : ED.rows[r][c]);
    if(old === v) return;
    ED.undo.push({ td: td, r: r, c: c, v: old });
    ED.rows[r][c] = v;
    td.textContent = v;
    td.style.background = color(v);
    td.className = 'day ' + (v === '' ? 'off' : (NOSTORE.indexOf(v) >= 0 ? 'store wvRot' : 'store')) + ' wvChg';
    recalcOff(r);
    if(String(ED.orig[r][c] || '') === v) td.classList.remove('wvChg');
    bar();
  }

  function undo(){
    if(!ED.undo.length) return;
    var u = ED.undo.pop();
    ED.rows[u.r][u.c] = u.v;
    u.td.textContent = u.v;
    u.td.style.background = color(u.v);
    u.td.className = 'day ' + (u.v === '' ? 'off' : (NOSTORE.indexOf(u.v) >= 0 ? 'store wvRot' : 'store')) + (String(ED.orig[u.r][u.c] || '') === u.v ? '' : ' wvChg');
    recalcOff(u.r);
    bar();
  }

  /* ---------- 검토 ---------- */
  function clearMarks(cls){
    var tbl = document.getElementById('schedTable'); if(!tbl) return;
    [].forEach.call(tbl.querySelectorAll('.' + cls), function(x){ x.classList.remove(cls); });
  }
  function dayCount(){
    var out = [];
    for(var j = 0; j < ED.dayIdx.length; j++){
      var c = ED.dayIdx[j], at = {};
      for(var r = ED.hi + 2; r < ED.rows.length; r++){
        var v = String(ED.rows[r][c] || '').trim().replace(/\((OP|CL)\)$/, '').trim();
        if(!v || SPECIAL.indexOf(v) >= 0 || NOSTORE.indexOf(v) >= 0) continue;
        (at[v] = at[v] || []).push(String(ED.rows[r][ED.nameCol] || '').trim());
      }
      out.push({ j: j, day: ED.rows[ED.hi][c], at: at });
    }
    return out;
  }
  function reviewGap(){
    clearMarks('wvGapH'); clearMarks('wvDup');
    var tbl = document.getElementById('schedTable');
    var head = tbl.querySelectorAll('tr')[0].children;
    var miss = [];
    dayCount().forEach(function(d){
      var empty = ED.stores.filter(function(s){ return !d.at[s]; });
      if(empty.length){ miss.push(d.day + '일 ' + empty.join(', '));
        var th = head[d.j + 2]; if(th) th.classList.add('wvGapH'); }
    });
    alert(miss.length ? '공백 매장 ' + miss.length + '건\n\n' + miss.join('\n') : '공백 매장 없음 — 모든 매장에 사람이 있습니다.');
  }
  function reviewDup(){
    clearMarks('wvGapH'); clearMarks('wvDup');
    var tbl = document.getElementById('schedTable');
    var list = [];
    dayCount().forEach(function(d){
      Object.keys(d.at).forEach(function(s){
        if(d.at[s].length < 2) return;
        list.push(d.day + '일 ' + s + ' — ' + d.at[s].join(', '));
        [].forEach.call(tbl.querySelectorAll('td[data-c="' + ED.dayIdx[d.j] + '"]'), function(td){
          var v = String(td.textContent).replace(/\((OP|CL)\)$/, '').trim();
          if(v === s) td.classList.add('wvDup');
        });
      });
    });
    alert(list.length ? '중복 근무 ' + list.length + '건\n\n' + list.slice(0, 25).join('\n') + (list.length > 25 ? '\n외 ' + (list.length - 25) + '건' : '') : '중복 근무 없음 — 모든 매장이 정원대로입니다.');
  }

  /* ---------- 변경 요약 ---------- */
  function diff(){
    var out = [];
    for(var r = ED.hi + 2; r < ED.rows.length; r++){
      var nm = String(ED.rows[r][ED.nameCol] || '').trim();
      for(var j = 0; j < ED.dayIdx.length; j++){
        var c = ED.dayIdx[j];
        var a = String(ED.orig[r][c] == null ? '' : ED.orig[r][c]).trim();
        var b = String(ED.rows[r][c] == null ? '' : ED.rows[r][c]).trim();
        if(a === b) continue;
        out.push(ED.rows[ED.hi][c] + '일 ' + nm + ' ' + (a || '휴무') + '→' + (b || '휴무'));
      }
    }
    return out;
  }

  /* ---------- 저장 ---------- */
  function save(){
    var ch = diff();
    if(!ch.length){ alert('변경된 내용이 없습니다.'); return; }
    var d = overlay(
      '<h3>수정된 스케줄로 반영하시겠습니까?</h3>' +
      '<p>변경 ' + ch.length + '건이 구글시트에 새 탭으로 저장되고, 직원 화면에 바로 반영됩니다.</p>' +
      '<div style="max-height:200px;overflow:auto;background:#f7f8fb;border-radius:10px;padding:10px 12px;font-size:12.5px;line-height:1.75;color:#3a3b47">' +
      ch.map(function(x){ return '· ' + x; }).join('<br>') + '</div>' +
      '<p style="margin:14px 0 6px;font-size:12.5px;color:#4a4b57;font-weight:700">직원에게 남길 말 (선택)</p>' +
      '<input id="wvMemo" class="wvIn" style="text-align:left" placeholder="예) 8월 12일 인수인계로 매장 조정했습니다">' +
      '<div class="wvErr" id="wvSerr"></div>' +
      '<div class="wvRow"><button class="wvBtn g" id="wvSx">아니오</button><button class="wvBtn p" id="wvSok">네, 반영합니다</button></div>'
    );
    d.querySelector('#wvSx').onclick = ovClose;
    d.querySelector('#wvSok').onclick = function(){
      var btn = this; btn.disabled = true; btn.textContent = '저장 중…';
      var memo = d.querySelector('#wvMemo').value;
      try{
      fetch(WEBAPP_URL, { method: 'POST', mode: 'no-cors',
        headers: { 'Content-Type': 'text/plain;charset=utf-8' },
        body: JSON.stringify({ token: (typeof SHEET_TOKEN !== 'undefined' && SHEET_TOKEN) ? SHEET_TOKEN : 'wevape2026', action: 'edit', pw: window.__wvPw,
                               month: curMonth(), rows: ED.rows, auto: ch.join(' · '), memo: memo })
      }).then(function(){
        ovClose(); exitEdit();
        alert('반영했습니다. 잠시 후 화면을 새로 불러옵니다.');
        setTimeout(function(){ location.reload(); }, 1200);
      }).catch(function(){
        btn.disabled = false; btn.textContent = '네, 반영합니다';
        d.querySelector('#wvSerr').textContent = '저장에 실패했습니다. 잠시 후 다시 시도해주세요.';
      });
      }catch(err){ btn.disabled = false; btn.textContent = '네, 반영합니다'; d.querySelector('#wvSerr').textContent = '오류: ' + err.message; }
    };
  }

  function curMonth(){ var s = document.getElementById('monthSel'); return s && s.value ? s.value : ''; }

  /* ---------- 하단 바 ---------- */
  function bar(show){
    var b = document.getElementById('wvBarEd');
    if(!b){ b = document.createElement('div'); b.id = 'wvBarEd'; document.body.appendChild(b); }
    if(show === false){ b.style.display = 'none'; return; }
    var n = ED ? diff().length : 0;
    b.innerHTML = '<span class="t">관리자 편집 중</span><span class="n">변경 ' + n + '건 · 칸을 눌러 바꾸세요</span>' +
      '<span style="flex:1"></span>' +
      '<button id="wvRg">공백매장 검토</button><button id="wvRd">중복근무 검토</button>' +
      '<button id="wvUn">되돌리기</button><button class="save" id="wvSv">저장</button><button class="exit" id="wvEx">나가기</button>';
    b.style.display = 'flex';
    b.querySelector('#wvRg').onclick = reviewGap;
    b.querySelector('#wvRd').onclick = reviewDup;
    b.querySelector('#wvUn').onclick = undo;
    b.querySelector('#wvSv').onclick = save;
    b.querySelector('#wvEx').onclick = function(){
      if(diff().length && !confirm('저장하지 않은 변경이 있습니다. 나가시겠습니까?')) return;
      exitEdit(); location.reload();
    };
  }
  function exitEdit(){
    document.body.classList.remove('wvEditing');
    ED = null; bar(false);
    var p = document.getElementById('wvPick'); if(p) p.style.display = 'none';
  }

  /* ---------- 공지사항 ---------- */
  function loadNotice(){
    var m = curMonth(); if(!m) return;
    fetch(WEBAPP_URL + '?mode=notice&month=' + encodeURIComponent(m) + '&t=' + Date.now())
      .then(function(r){ return r.text(); })
      .then(function(t){
        var list = []; try{ list = JSON.parse(t); }catch(e){ return; }
        var box = document.getElementById('wvNotice');
        if(!list.length){ if(box) box.remove(); return; }
        if(!box){
          box = document.createElement('div'); box.id = 'wvNotice';
          var h1 = document.getElementById('title');
          if(!h1 || !h1.parentNode) return;
          h1.parentNode.insertBefore(box, h1.nextSibling);
          box.addEventListener('click', function(e){ e.stopPropagation(); togglePop(list); });
        }
        var top = list[0];
        var one = (top.memo && top.memo.trim()) ? top.memo.trim() : (top.auto || '');
        box.innerHTML = '<span class="lbl">📌 변경 안내</span><span class="txt">' + esc(one) + '</span>' +
                        (list.length > 1 ? '<span class="cnt">' + list.length + '</span>' : '');
        box.title = '눌러서 전체 보기';
      }).catch(function(){});
  }

  function togglePop(list){
    var p = document.getElementById('wvNpop');
    if(p && p.style.display === 'block'){ p.style.display = 'none'; return; }
    if(!p){
      p = document.createElement('div'); p.id = 'wvNpop';
      document.body.appendChild(p);
      p.addEventListener('click', function(e){ e.stopPropagation(); });
      document.addEventListener('click', function(){ p.style.display = 'none'; });
    }
    p.innerHTML = '<h4>📌 변경 안내</h4>' + list.map(function(x){
      return '<div class="it"><span class="dt">' + esc(x.at) + '</span>' +
             (x.memo ? '<span class="memo">' + esc(x.memo) + '</span><br>' : '') +
             esc(x.auto || '') + '</div>';
    }).join('');
    var box = document.getElementById('wvNotice');
    var rc = box.getBoundingClientRect();
    p.style.display = 'block';
    var w = p.offsetWidth, h = p.offsetHeight;
    p.style.left = Math.max(8, Math.min(window.innerWidth - w - 8, rc.left)) + 'px';
    p.style.top  = (rc.bottom + h + 12 > window.innerHeight ? Math.max(8, rc.top - h - 6) : rc.bottom + 6) + 'px';
  }

  /* 순환은 매장이 아니므로 팔레트 색 대신 고유 표시로 통일 */
  function paintRot(){
    var tbl = document.getElementById('schedTable'); if(!tbl) return;
    [].forEach.call(tbl.querySelectorAll('td'), function(td){
      if(NOSTORE.indexOf(String(td.textContent).trim()) < 0) return;
      td.classList.add('wvRot');
      td.style.background = '#eef1f5';
    });
  }

  /* 칸을 고치면 그 사람 집계열(휴무·훈련·병가 등)을 모두 다시 센다 */
  function recalcOff(r){
    if(!ED || !ED.sumCols || !ED.sumCols.length) return;
    var tbl = document.getElementById('schedTable');
    var trs = tbl ? [].slice.call(tbl.querySelectorAll('tr')) : [];
    var tr = trs[1 + (r - (ED.hi + 2))];
    ED.sumCols.forEach(function(sc, k){
      var want = sc.key.split(/[\/·,]/).map(function(x){ return x.trim(); }).filter(Boolean);
      var n = 0;
      for(var j = 0; j < ED.dayIdx.length; j++){
        var v = String(ED.rows[r][ED.dayIdx[j]] == null ? '' : ED.rows[r][ED.dayIdx[j]]).trim();
        if(sc.key === '휴무'){ if(v === '') n++; }
        else if(want.indexOf(v) >= 0) n++;
      }
      ED.rows[r][sc.c] = String(n);
      if(tr){ var td = tr.children[2 + ED.dayIdx.length + k]; if(td) td.textContent = n; }
    });
  }

  /* 일반 화면에서도 우측 집계열(휴무·훈련·병가·휴가)을 실제 표 내용으로 다시 센다.
     시트 값이 오래됐어도 직원이 보는 숫자는 항상 맞게 표시된다. (시트는 바뀌지 않음) */
  function recalcSumsView(){
    var tbl = document.getElementById('schedTable'); if(!tbl) return;
    var trs = [].slice.call(tbl.querySelectorAll('tr')); if(trs.length < 2) return;
    var head = [].slice.call(trs[0].children).map(function(x){ return String(x.textContent).replace(/\s+/g, ' ').trim(); });
    var dayN = 0;
    for(var c = 2; c < head.length; c++){ if(/^\d{1,2}\b/.test(head[c])) dayN++; else break; }
    if(!dayN) return;
    var sums = [];
    for(var c2 = 2 + dayN; c2 < head.length; c2++) sums.push({ i: c2, key: head[c2] });
    if(!sums.length) return;
    for(var r = 1; r < trs.length; r++){
      var tds = [].slice.call(trs[r].children);
      if(tds.length < 2 + dayN) continue;
      var vals = [];
      for(var d = 0; d < dayN; d++){
        var td = tds[2 + d];
        vals.push(td ? String(td.textContent).replace(/(OP|CL)$/, '').trim() : '');
      }
      sums.forEach(function(sc){
        var want = sc.key.split(/[\/·,\s]+/).map(function(x){ return x.trim(); }).filter(Boolean);
        var n = 0;
        vals.forEach(function(v){
          if(sc.key === '휴무'){ if(v === '') n++; }
          else if(want.indexOf(v) >= 0) n++;
        });
        var cell = tds[sc.i];
        if(cell) cell.textContent = n;
      });
    }
  }

  /* ---------- 진입 ---------- */
  function addGear(){
    if(document.getElementById('wvGear')) return;
    var stamp = document.getElementById('stamp');
    if(!stamp || !stamp.parentNode) return;
    var g = document.createElement('button');
    g.id = 'wvGear'; g.type = 'button'; g.title = '관리자 모드'; g.textContent = '⚙';
    g.addEventListener('click', function(){ if(ED) return; askPw(); });
    stamp.parentNode.insertBefore(g, stamp);
  }

  css();
  if(typeof render === 'function' && !render.__wvadm){
    var _r = render;
    var w = function(rows){ try{ window.__wvRows = rows; }catch(e){} var o = _r.apply(this, arguments);
      try{ addGear(); loadNotice(); paintRot(); recalcSumsView(); }catch(e){} return o; };
    w.__wvadm = true; render = w;
  }
  try{ addGear(); }catch(e){}
  setTimeout(function(){ try{ loadNotice(); }catch(e){} }, 1500);
})();
</script>

    ].join('\n');
    document.head.appendChild(s);
  }

  function esc(s){ return String(s == null ? '' : s).replace(/[&<>]/g, function(c){ return { '&':'&amp;','<':'&lt;','>':'&gt;' }[c]; }); }

  function rowsOf(){
    var tbl = document.getElementById('schedTable'); if(!tbl) return [];
    return [].slice.call(tbl.querySelectorAll('tr')).slice(1).filter(function(tr){ return tr.querySelector('td.namecol'); });
  }
  function nameOf(tr){ var b = tr.querySelector('td.namecol b'); return b ? b.textContent.trim() : ''; }
  function titleOf(tr){ var t = tr.querySelector('td.namecol .ttl'); return t ? t.textContent.trim() : ''; }

  function daysOf(tr){
    var out = [];
    [].slice.call(tr.querySelectorAll('td[data-d]')).forEach(function(td){
      var raw = String(td.textContent).trim();
      var oc = td.querySelector('.opcl');
      var base = raw.replace(/(OP|CL)$/, '').trim();
      out.push({ d: +td.getAttribute('data-d'), v: base, oc: oc ? oc.textContent.trim() : '',
                 bg: getComputedStyle(td).backgroundColor, off: base === '' });
    });
    return out;
  }

  function bar(show){
    var b = document.getElementById('wvMcBar');
    if(!b){ b = document.createElement('div'); b.id = 'wvMcBar'; document.body.appendChild(b); }

  function mode(on){
    document.body.classList.toggle('wvPicking', on);
    var btn = document.getElementById('wvMc'); if(btn) btn.classList.toggle('on', on);

  function openCal(){
    if(!sel.length){ alert('먼저 이름을 눌러 직원을 선택하세요.'); return; }

      ov.addEventListener('click', function(e){ if(e.target === ov) ov.style.display = 'none'; }); }
    draw(ov, 'mix');
    ov.style.display = 'flex';

  function grid(cells, Y, M){
    var DOW = ['일','월','화','수','목','금','토'];
    var first = (Y && M) ? new Date(Y, M - 1, 1).getDay() : 0;
    var h = '<div class="wvDow">' + DOW.map(function(x, i){ return '<div class="' + (i === 0 ? 'sun' : i === 6 ? 'sat' : '') + '">' + x + '</div>'; }).join('') + '</div><div class="wvG">';
    for(var i = 0; i < first; i++) h += '<div class="wvC e"></div>';
    cells.forEach(function(c){
      var wd = (Y && M) ? new Date(Y, M - 1, c.d).getDay() : -1;

  }

  function draw(ov, view){
    var mv = (document.getElementById('monthSel') || {}).value || '';

    var picked = sel.map(function(tr){ return { name: nameOf(tr), title: titleOf(tr), days: daysOf(tr) }; });

    var body = '';

      }).join('') + '</div>';

      '<span style="color:#9a9ba6;font-size:12px">' + esc(mv) + ' · ' + esc(picked.map(function(x){ return x.name; }).join(', ')) + '</span>' +
      '<span style="flex:1"></span>' +
      '<button class="wvMcTab' + (view === 'mix' ? ' on' : '') + '" data-v="mix">한 칸에 함께</button>' +
      '<button class="wvMcTab' + (view === 'each' ? ' on' : '') + '" data-v="each">사람별로</button>' +
      '<button class="wvMcX" id="wvMcClose">✕</button></div>' + body + '</div>';
    ov.querySelector('#wvMcClose').onclick = function(){ ov.style.display = 'none'; };
    [].slice.call(ov.querySelectorAll('.wvMcTab')).forEach(function(b){
      b.onclick = function(e){ e.stopPropagation(); draw(ov, b.getAttribute('data-v')); };
    });

    rowsOf().forEach(function(tr){
      var n = tr.querySelector('td.namecol');

      n.__wvMc = true;
      n.addEventListener('click', function(e){

        e.stopPropagation(); e.preventDefault();
        var i = sel.indexOf(tr);
        if(i >= 0){ sel.splice(i, 1); n.classList.remove('pk'); }
        else { sel.push(tr); n.classList.add('pk'); }
        bar(true);
      }, true);
    });

  }
  setTimeout(function(){ try{ addBtn(); hook(); }catch(e){} }, 1600);
})();
</script>
