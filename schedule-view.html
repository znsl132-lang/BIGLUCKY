    paint(shell('1 / 3 · 기입 방식', '직원 추가',
      '<p class="wvA-q">어떻게 입력할까요?</p>'
      + '<p class="wvA-d">자동 기입을 고르면 직책에 맞는 휴무 일수를 미리 채워 드립니다.</p>'
      + '<div class="wvA-pick">'
      + '<button id="wvAeAuto"><b>자동 기입</b><span>직책·근무형태에 맞는 기본값을 채운 뒤 확인만 하면 됩니다</span></button>'
      + '<button id="wvAeMan"><b>수동 기입</b><span>모든 항목을 직접 입력합니다</span></button>'
      + '</div>'));
    document.getElementById('wvAeAuto').onclick = function(){ step2(true); };
    document.getElementById('wvAeMan').onclick  = function(){ step2(false); };
  }
  function step2(auto){
    var sts = storeNames();
    var homeOpts = ['순환'].concat(sts).map(function(n){ return '<option>' + esc(n) + '</option>'; }).join('');
    var titOpts  = TITLES.map(function(n){ return '<option' + (n === '주임' ? ' selected' : '') + '>' + esc(n) + '</option>'; }).join('');
    var wOpts    = WORKT.map(function(n){ return '<option>' + esc(n) + '</option>'; }).join('');
    paint(shell('2 / 3 · 정보 입력', '직원 추가',
      '<div class="wvA-f">'
      + '<label>성명</label><input id="wvAeName" placeholder="예: 김위베" autocomplete="off">'
      + '<label>직책</label><select id="wvAeTitle">' + titOpts + '</select>'
      + '<label>소속</label><select id="wvAeHome">' + homeOpts + '</select>'
      + '<label>근무형태</label><select id="wvAeWork">' + wOpts + '</select>'
      + '<label>월 휴무</label><input id="wvAeOff" type="number" min="0" max="20" value="10">'
      + '</div>'
      + '<div class="wvA-err" id="wvAeErr"></div>'
      + '<div class="wvA-bar"><button id="wvAeBack">이전</button><button class="pri" id="wvAeNext">다음</button></div>'));
    var t = document.getElementById('wvAeTitle'), off = document.getElementById('wvAeOff'), w = document.getElementById('wvAeWork');
    function autofill(){
      if(!auto) return;
      var v = t.value;
      off.value = (v === '교육생') ? 8 : (w.value === '파트' ? 12 : 10);
    }
    t.onchange = autofill; w.onchange = autofill; autofill();
    document.getElementById('wvAeBack').onclick = step1;
    document.getElementById('wvAeNext').onclick = function(){
      var nm = (document.getElementById('wvAeName').value || '').trim();
      var er = document.getElementById('wvAeErr');
      if(!nm){ er.textContent = '성명을 입력해 주세요'; return; }
      if((cfg.emps || []).some(function(e){ return e.name === nm; })){ er.textContent = '이미 있는 이름입니다'; return; }
      var o = parseInt(off.value, 10);
      if(!(o >= 0 && o <= 20)){ er.textContent = '월 휴무는 0~20 사이로 입력해 주세요'; return; }
      F = { name:nm, title:t.value, home:document.getElementById('wvAeHome').value,
            work:w.value, offN:o, mate:'' };
      if(t.value === '교육생') step3(); else confirmSheet();
    };
  }
  function step3(){
    var ls = leaders();
    var btns = ls.map(function(e, i){
      return '<button data-n="' + esc(e.name) + '"><b>' + esc(e.name) + ' 팀장</b>'
        + '<span>이 사람의 이번 달 근무를 그대로 따라갑니다</span></button>';
    }).join('');
    paint(shell('3 / 3 · 교육 동행', '직원 추가',
      '<p class="wvA-q">어느 사람과 스케줄을 맞출까요?</p>'
      + '<p class="wvA-d">' + esc(F.name) + ' 님은 <b>휴무 ' + F.offN + '일</b>, 팀장은 10일입니다.<br>'
      + '팀장이 쉬는 날 중 <b>' + Math.max(0, 10 - F.offN) + '일</b>은 다른 팀장 근무지에 자동으로 붙입니다.<br>'
      + '복사한 뒤 관리자 모드에서 자유롭게 고칠 수 있습니다.</p>'
      + '<div class="wvA-pick">' + btns
      + '<button data-n=""><b>수동 입력</b><span>빈 칸으로 추가하고 직접 채워 넣습니다</span></button>'
      + '</div>'));
    var o = document.getElementById('wvAeOv');
    o.querySelectorAll('.wvA-pick button').forEach(function(b){
      b.onclick = function(){ F.mate = b.getAttribute('data-n') || ''; confirmSheet(); };
    });
  }
  function confirmSheet(){
    paint(shell('마지막 확인', '직원 추가',
      '<p class="wvA-q">스케줄 생성기에도 반영하시겠습니까?</p>'
      + '<p class="wvA-d">네를 고르면 구글시트 <b>설정</b> 탭에 저장되어,<br>'
      + '다음에 스케줄 생성기를 열 때 이 직원이 자동으로 들어갑니다.</p>'
      + '<div class="wvA-f" style="grid-template-columns:92px 1fr;font-size:13px">'
      + '<label>성명</label><div>' + esc(F.name) + '</div>'
      + '<label>직책</label><div>' + esc(F.title) + '</div>'
      + '<label>소속</label><div>' + esc(F.home) + '</div>'
      + '<label>근무형태</label><div>' + esc(F.work) + '</div>'
      + '<label>월 휴무</label><div>' + F.offN + '일</div>'
      + (F.mate ? '<label>교육 동행</label><div>' + esc(F.mate) + ' 팀장</div>' : '')
      + '</div>'
      + '<div class="wvA-err" id="wvAeErr"></div>'
      + '<div class="wvA-bar"><button id="wvAeNo">아니오</button><button class="pri" id="wvAeYes">네, 반영합니다</button></div>'));
    document.getElementById('wvAeNo').onclick  = function(){ addRow(false); };
    document.getElementById('wvAeYes').onclick = function(){ saveSheet(); };
  }
  function saveSheet(){
    var btn = document.getElementById('wvAeYes');
    var er = document.getElementById('wvAeErr');
    btn.disabled = true; btn.textContent = '저장 중…';
    var e = { name:F.name, title:F.title, home:F.home,
      role: (F.title === '교육생') ? '교육' : (F.work === '파트' ? '파트' : '풀타임'),
      offN: F.offN, type: (F.work === '파트' ? '파트타임' : '정규직'), pref:[], ban:[] };
    var emps = (cfg.emps || []).slice(); emps.push(e);
    fetch(URL_, { method:'POST', body: JSON.stringify({
        action:'cfg', token:'wevape2026', who:'뷰어', stores:cfg.stores, emps:emps }) })
      .then(function(r){ return r.text(); })
      .then(function(t){
        var j = null; try{ j = JSON.parse(t); }catch(x){}
        btn.disabled = false; btn.textContent = '네, 반영합니다';
        if(j && j.ok){ cfg.emps = emps; addRow(true); }
        else { er.textContent = '저장 실패: ' + ((j && j.reason) || '응답 오류'); }
      })
      ['catch'](function(){ btn.disabled = false; btn.textContent = '네, 반영합니다'; er.textContent = '저장 실패 · 인터넷 연결을 확인해 주세요'; });
  }
  function addRow(saved){
    var R = (window.__wvActiveRows ? window.__wvActiveRows() : window.__wvRows);
    var done = false, copied = 0;
    window.__wvAeFill = 0; window.__wvAeShort = 0; window.__wvAeOff = 0;
    if(R && R.length > 3){
      var head = R[1].map(function(x){ return String(x).trim(); });
      var nameCol = head.indexOf('성명'); if(nameCol < 0) nameCol = 1;
      var W = head.length;
      var dayIdx = [];
      for(var c = 0; c < W; c++) if(/^\d{1,2}$/.test(head[c])) dayIdx.push(c);
      var row = [];
      for(var i = 0; i < W; i++) row.push('');
      row[0] = R[3] ? R[3][0] : '위베이프';
      row[nameCol] = F.name;
      row[nameCol + 1] = F.title;
      row[nameCol + 2] = F.home;
      var filled = 0, short = 0;
      function findRow(nm){
        for(var r = 3; r < R.length; r++) if(String(R[r][nameCol]).trim() === nm) return R[r];
        return null;
      }
      function cellOf(rw, c){
        return String((rw && rw[c]) || '').replace(/\((OP|CL)\)$/, '').trim();
      }
      if(F.mate){
        var mr = findRow(F.mate);
        if(mr){
          for(var k = 0; k < dayIdx.length; k++){
            var v = cellOf(mr, dayIdx[k]);
            if(v === '전휴무' || v === '휴가' || v === '병가' || v === '훈련' || v === '출장') v = '';
            row[dayIdx[k]] = v; if(v) copied++;
          }
          var offNow = 0;
          for(var q = 0; q < dayIdx.length; q++) if(!row[dayIdx[q]]) offNow++;
          var needFill = offNow - F.offN;
          if(needFill > 0){
            var others = leaders().filter(function(x){ return x.name !== F.mate; }).map(function(x){ return findRow(x.name); }).filter(Boolean);
            for(var q2 = 0; q2 < dayIdx.length && needFill > 0; q2++){
              if(row[dayIdx[q2]]) continue;
              for(var oi = 0; oi < others.length; oi++){
                var ov2 = cellOf(others[oi], dayIdx[q2]);
                if(ov2 && ov2 !== '전휴무' && ov2 !== '휴가' && ov2 !== '병가' && ov2 !== '훈련' && ov2 !== '출장'){
                  row[dayIdx[q2]] = ov2; needFill--; filled++; break;
                }
              }
            }
            short = needFill;
          }
        }
      }
      var off = 0;
      for(var k2 = 0; k2 < dayIdx.length; k2++) if(!String(row[dayIdx[k2]]).trim()) off++;
      var sumStart = dayIdx.length ? dayIdx[dayIdx.length - 1] + 1 : W - 3;
      if(sumStart < W) row[sumStart] = String(off);
      for(var s2 = sumStart + 1; s2 < W; s2++) row[s2] = '0';
      window.__wvAeFill = filled; window.__wvAeShort = short; window.__wvAeOff = off;
      R.push(row);
      try{ render(R); if(window.__wvSyncEdit) window.__wvSyncEdit(R); }catch(x){}
      done = true;
    }
    paint(shell('완료', '직원 추가',
      '<div class="wvA-ok"><b>' + esc(F.name) + '</b> 님을 추가했습니다.<br><br>'
      + (saved ? '· 구글시트 <b>설정</b> 탭에 저장했습니다 — 생성기를 열면 자동 반영됩니다<br>'
               : '· 생성기에는 <b>반영하지 않았습니다</b> — 나중에 필요하면 다시 추가하세요<br>')
      + (done ? ('· 이번 달 스케줄 표 <b>맨 아래</b>에 행을 넣었습니다'
                 + (copied ? ' (' + esc(F.mate) + ' 팀장 근무 ' + copied + '일 복사' + (window.__wvAeFill ? ' · 다른 팀장 근무 ' + window.__wvAeFill + '일 추가' : '') + ')' : ' (빈 칸)') + '<br>'
                 + '· 휴무 <b>' + window.__wvAeOff + '일</b> (목표 ' + F.offN + '일)<br>'
                 + (window.__wvAeShort ? '· <b style="color:#a86400">' + window.__wvAeShort + '일은 채우지 못했습니다 — 직접 입력해 주세요</b><br>' : ''))
              : '· 이번 달 표에는 넣지 못했습니다 (스케줄을 먼저 불러오세요)<br>')
      + '</div>'
      + '<p class="wvA-d" style="margin-top:12px">이번 달 표는 아직 <b>화면에만</b> 있습니다.<br>'
      + '오른쪽 위 <b>설정 아이콘 → 관리자 모드</b>로 들어가 내용을 확인한 뒤 <b>저장</b>을 눌러야<br>'
      + '구글시트에 <b>(수정N)</b> 탭으로 기록됩니다.</p>'
      + '<div class="wvA-bar"><button class="pri" id="wvAeDone">확인</button></div>'));
    document.getElementById('wvAeDone').onclick = close;
  }
  function isAdmin(){
    return !!window.__wvPw || document.body.classList.contains('wvEditing');
  }
  function start(){
    if(!isAdmin()){ alert('관리자 모드에서만 사용할 수 있습니다.\n\n오른쪽 위 설정 아이콘 → 관리자 모드로 들어간 뒤 다시 눌러 주세요.'); return; }
    if(!URL_){ alert('시트 주소가 없습니다'); return; }
    paint(shell('불러오는 중', '직원 추가', '<p class="wvA-d">현재 직원·매장 설정을 불러오는 중입니다…</p>'));
    fetch(URL_ + '?mode=cfg&t=' + Date.now(), {cache:'no-store'})
      .then(function(r){ return r.text(); })
      .then(function(t){
        var j = null; try{ j = JSON.parse(t); }catch(x){}
        if(!j || !j.ok){
          paint(shell('오류', '직원 추가',
            '<p class="wvA-d" style="color:#c5221f">시트 설정을 읽지 못했습니다: '
            + esc((j && j.reason) || '응답 오류') + '</p>'
            + '<div class="wvA-bar"><button class="pri" id="wvAeDone">닫기</button></div>'));
          document.getElementById('wvAeDone').onclick = close;
          return;
        }
        cfg = { stores:j.stores || [], emps:j.emps || [] };
        step1();
      })
      ['catch'](function(){
        paint(shell('오류', '직원 추가',
          '<p class="wvA-d" style="color:#c5221f">시트에 연결하지 못했습니다</p>'
          + '<div class="wvA-bar"><button class="pri" id="wvAeDone">닫기</button></div>'));
        document.getElementById('wvAeDone').onclick = close;
      });
  }
  function mountBtn(){
    var ex = document.getElementById('wvAeBtn');
    if(ex){ ex.style.display = isAdmin() ? '' : 'none'; return; }
    var bar = null, cands = document.querySelectorAll('button');
    for(var i = 0; i < cands.length; i++){
      var tx = (cands[i].textContent || '').trim();
      if(tx === '엑셀 저장' || tx === '여러 명 보기'){ bar = cands[i].parentNode; break; }
    }
    if(!bar) return;
    var b = document.createElement('button');
    b.id = 'wvAeBtn'; b.textContent = '직원 추가';
    b.style.cssText = 'font-size:12px;padding:5px 10px;border-radius:8px;border:1px solid ' + NAVY
      + ';background:' + NAVY + ';color:#fff;cursor:pointer;margin-left:6px;font-weight:700';
    b.style.display = isAdmin() ? '' : 'none';
    b.onclick = start;
    bar.appendChild(b);
  }
  function loop(){ mountBtn(); setTimeout(loop, 1500); }
  setTimeout(loop, 1600);
})();
</script>

<script>
/* ===== 직원 수정 (뷰어) =====
   설정 시트의 직원 정보를 고치고, 이번 달 스케줄 표와 (수정N) 시트까지 함께 반영한다. */
(function(){
  if(window.__wvEditEmp) return; window.__wvEditEmp = true;
  var URL_ = (typeof WEBAPP_URL !== 'undefined' && WEBAPP_URL) ? WEBAPP_URL : '';
  var TOKEN = (typeof SHEET_TOKEN !== 'undefined' && SHEET_TOKEN) ? SHEET_TOKEN : 'wevape2026';
  var NAVY = '#2b2d42';
  var GOLD = '#c9a227';
  var TITLES = ['주임','매니저','팀장','실장','교육생'];
  var WORKT  = ['풀타임','파트'];
  var cfg = null, orig = null, F = null;

  function esc(s){ return String(s == null ? '' : s).replace(/[&<>"]/g, function(c){
    return ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'})[c]; }); }
  function isAdmin(){ return !!window.__wvPw || document.body.classList.contains('wvEditing'); }

  function css(){
    if(document.getElementById('wvAeCss') || document.getElementById('wvEeCss')) return;
    var st = document.createElement('style'); st.id = 'wvEeCss';
    st.textContent = [
      '#wvAeOv{position:fixed;inset:0;background:rgba(10,12,25,.55);z-index:10060;display:none;align-items:center;justify-content:center;padding:16px}',
      '.wvA{background:#fff;border-radius:16px;width:min(520px,95vw);max-height:90vh;overflow:auto;box-shadow:0 24px 70px rgba(0,0,0,.35)}',
      '.wvA-top{background:' + NAVY + ';color:#fff;padding:14px 18px;display:flex;align-items:center;justify-content:space-between}',
      '.wvA-top b{font-size:16px;letter-spacing:-.3px}',
      '.wvA-top .step{font-size:11.5px;opacity:.75}',
      '.wvA-x{border:none;background:rgba(255,255,255,.15);color:#fff;width:30px;height:30px;border-radius:50%;font-size:15px;cursor:pointer}',
      '.wvA-b{padding:18px}',
      '.wvA-q{font-size:14px;font-weight:700;margin:0 0 4px}',
      '.wvA-d{font-size:12px;color:#8a8b93;margin:0 0 14px;line-height:1.6}',
      '.wvA-pick{display:grid;gap:10px}',
      '.wvA-pick button{text-align:left;padding:14px 16px;border:1px solid #d7dbe3;border-radius:12px;background:#fff;cursor:pointer;font-size:13.5px;line-height:1.5}',
      '.wvA-pick button:hover{border-color:' + GOLD + ';background:#fffdf5}',
      '.wvA-pick button b{display:block;font-size:14px;margin-bottom:3px}',
      '.wvA-pick button span{color:#8a8b93;font-size:12px}',
      '.wvA-f{display:grid;grid-template-columns:92px 1fr;gap:10px 12px;align-items:center}',
      '.wvA-f label{font-size:12.5px;color:#5b6b7a;font-weight:600}',
      '.wvA-f input,.wvA-f select{width:100%;font-size:13.5px;padding:8px 10px;border:1px solid #d7dbe3;border-radius:9px;background:#fff}',
      '.wvA-f input:focus,.wvA-f select:focus{outline:none;border-color:' + NAVY + '}',
      '.wvA-bar{display:flex;gap:8px;margin-top:18px}',
      '.wvA-bar button{flex:1;font-size:13.5px;padding:11px;border-radius:10px;border:1px solid #c9ced8;background:#f7f8fa;cursor:pointer}',
      '.wvA-bar button.pri{background:' + NAVY + ';color:#fff;border-color:' + NAVY + ';font-weight:700}',
      '.wvA-bar button:disabled{opacity:.5;cursor:default}',
      '.wvA-err{color:#c5221f;font-size:12.5px;margin-top:10px;min-height:17px;font-weight:600}',
      '.wvA-ok{background:#f4f8f5;border:1px solid #cfe6d6;border-radius:10px;padding:12px 14px;font-size:13px;line-height:1.7;color:#2b4f38}'
    ].join('');
    document.head.appendChild(st);
  }
  window.__wvWizCss = css;
  function ov(){
    var o = document.getElementById('wvAeOv');
    if(!o){ o = document.createElement('div'); o.id = 'wvAeOv';
      o.addEventListener('click', function(e){ if(e.target === o) o.style.display='none'; });
      document.body.appendChild(o); }
    css();
    o.style.display = 'flex'; return o;
  }
  function close(){ var o = document.getElementById('wvAeOv'); if(o) o.style.display = 'none'; }
  function shell(step, inner){
    return '<div class="wvA"><div class="wvA-top"><div><b>직원 수정</b>'
      + '<div class="step">' + esc(step) + '</div></div>'
      + '<button class="wvA-x" id="wvEeX">✕</button></div>'
      + '<div class="wvA-b">' + inner + '</div></div>';
  }
  function paint(html){ var o = ov(); o.innerHTML = html;
    var x = document.getElementById('wvEeX'); if(x) x.onclick = close; }

  function storeNames(){ return (cfg && cfg.stores) ? cfg.stores.map(function(s){ return s.n; }) : []; }

  /* 1단계 : 직원 선택 */
  function pick(){
    var rows = (cfg.emps || []).map(function(e, i){
      var sub = e.title + ' · ' + e.home + ' · 휴무 ' + (e.offN == null ? 10 : e.offN) + '일'
        + (e.role && e.role !== '풀타임' ? ' · ' + e.role : '');
      return '<button data-i="' + i + '"><b>' + esc(e.name) + '</b><span>' + esc(sub) + '</span></button>';
    }).join('');
    paint(shell('1 / 2 · 직원 선택',
      '<p class="wvA-q">누구를 고칠까요?</p>'
      + '<p class="wvA-d">설정 시트에 저장된 직원 목록입니다.</p>'
      + '<div class="wvA-pick" style="max-height:52vh;overflow:auto">' + rows + '</div>'));
    document.getElementById('wvAeOv').querySelectorAll('.wvA-pick button').forEach(function(b){
      b.onclick = function(){ form(+b.getAttribute('data-i')); };
    });
  }

  /* 2단계 : 정보 수정 */
  function form(i){
    var e = cfg.emps[i];
    orig = JSON.parse(JSON.stringify(e));
    var sts = storeNames();
    function opts(arr, cur){ return arr.map(function(n){
      return '<option' + (cur === n ? ' selected' : '') + '>' + esc(n) + '</option>'; }).join(''); }
    var work = (e.type === '파트타임' || e.role === '파트') ? '파트' : '풀타임';
    paint(shell('2 / 2 · 정보 수정',
      '<div class="wvA-f">'
      + '<label>성명</label><input id="wvEeName" value="' + esc(e.name) + '">'
      + '<label>직책</label><select id="wvEeTitle">' + opts(TITLES, e.title) + '</select>'
      + '<label>소속</label><select id="wvEeHome">' + opts(['순환'].concat(sts), e.home) + '</select>'
      + '<label>근무형태</label><select id="wvEeWork">' + opts(WORKT, work) + '</select>'
      + '<label>월 휴무</label><input id="wvEeOff" type="number" min="0" max="20" value="' + (e.offN == null ? 10 : e.offN) + '">'
      + '<label>우선 배치</label><input id="wvEePref" value="' + esc((e.pref || []).join(',')) + '" placeholder="구월,검단">'
      + '<label>편성 제외</label><input id="wvEeBan" value="' + esc((e.ban || []).join(',')) + '" placeholder="비워두면 제한 없음">'
      + '</div>'
      + '<p class="wvA-d" style="margin-top:12px">직책을 <b>교육생</b>으로 두면 역할이 <b>교육</b>이 되어<br>'
      + '매장 인원 산정에서 빠집니다. 그 외에는 정상 인원으로 셉니다.</p>'
      + '<div class="wvA-err" id="wvEeErr"></div>'
      + '<div class="wvA-bar"><button id="wvEeBack">이전</button><button class="pri" id="wvEeNext">반영하기</button></div>'));
    document.getElementById('wvEeBack').onclick = pick;
    document.getElementById('wvEeNext').onclick = function(){
      var er = document.getElementById('wvEeErr');
      var nm = (document.getElementById('wvEeName').value || '').trim();
      if(!nm){ er.textContent = '성명을 입력해 주세요'; return; }
      if(nm !== orig.name && (cfg.emps || []).some(function(x){ return x.name === nm; })){
        er.textContent = '이미 있는 이름입니다'; return; }
      var off = parseInt(document.getElementById('wvEeOff').value, 10);
      if(!(off >= 0 && off <= 20)){ er.textContent = '월 휴무는 0~20 사이로 입력해 주세요'; return; }
      var wk = document.getElementById('wvEeWork').value;
      var tt = document.getElementById('wvEeTitle').value;
      function arr(v){ return (v || '').split(',').map(function(x){ return x.trim(); }).filter(function(x){ return x; }); }
      var pref = arr(document.getElementById('wvEePref').value);
      var ban  = arr(document.getElementById('wvEeBan').value);
      var bad = pref.concat(ban).filter(function(x){ return sts.indexOf(x) < 0; });
      if(bad.length){ er.textContent = '매장 목록에 없는 이름: ' + bad.join(', '); return; }
      var both = pref.filter(function(x){ return ban.indexOf(x) >= 0; });
      if(both.length){ er.textContent = '우선 배치와 편성 제외에 같은 매장이 있습니다: ' + both.join(', '); return; }
      F = { idx:i, name:nm, title:tt, home:document.getElementById('wvEeHome').value,
        role: (tt === '교육생') ? '교육' : (wk === '파트' ? '파트' : '풀타임'),
        type: (wk === '파트' ? '파트타임' : '정규직'), offN:off, pref:pref, ban:ban };
      confirmStep();
    };
  }

  function diffLines(){
    var d = [];
    function cmp(lab, a, b){ if(String(a) !== String(b)) d.push(lab + ' ' + (a || '-') + ' → ' + (b || '-')); }
    cmp('성명', orig.name, F.name);
    cmp('직책', orig.title, F.title);
    cmp('소속', orig.home, F.home);
    cmp('역할', orig.role || '풀타임', F.role);
    cmp('월 휴무', (orig.offN == null ? 10 : orig.offN) + '일', F.offN + '일');
    cmp('우선 배치', (orig.pref || []).join(',') || '-', F.pref.join(',') || '-');
    cmp('편성 제외', (orig.ban || []).join(',') || '-', F.ban.join(',') || '-');
    return d;
  }

  /* 확인 */
  function confirmStep(){
    var d = diffLines();
    if(!d.length){ paint(shell('변경 없음',
      '<p class="wvA-d">바뀐 내용이 없습니다.</p>'
      + '<div class="wvA-bar"><button class="pri" id="wvEeDone">닫기</button></div>'));
      document.getElementById('wvEeDone').onclick = close; return; }
    paint(shell('마지막 확인',
      '<p class="wvA-q">이대로 반영할까요?</p>'
      + '<div class="wvA-ok" style="background:#f7f8fb;border-color:#e2e6ee;color:#3b4252">'
      + '<b>' + esc(orig.name) + '</b><br>' + d.map(esc).join('<br>') + '</div>'
      + '<p class="wvA-d" style="margin-top:12px">저장하면 아래 세 곳에 함께 반영됩니다.<br>'
      + '· 구글시트 <b>설정</b> 탭 (생성기가 읽는 값)<br>'
      + '· 이번 달 스케줄 표 (성명·직책·소속)<br>'
      + '· 구글시트 <b>(수정N)</b> 탭 (기록)</p>'
      + '<div class="wvA-err" id="wvEeErr"></div>'
      + '<div class="wvA-bar"><button id="wvEeNo">취소</button><button class="pri" id="wvEeYes">네, 반영합니다</button></div>'));
    document.getElementById('wvEeNo').onclick = close;
    document.getElementById('wvEeYes').onclick = doSave;
  }

  /* 저장 */
  function doSave(){
    var btn = document.getElementById('wvEeYes'), er = document.getElementById('wvEeErr');
    btn.disabled = true; btn.textContent = '저장 중…';
    var emps = cfg.emps.slice();
    emps[F.idx] = { name:F.name, title:F.title, home:F.home, role:F.role,
      offN:F.offN, type:F.type, pref:F.pref, ban:F.ban };
    fetch(URL_, { method:'POST', body: JSON.stringify({
        action:'cfg', token:'wevape2026', who:'뷰어', stores:cfg.stores, emps:emps }) })
      .then(function(r){ return r.text(); })
      .then(function(t){
        var j = null; try{ j = JSON.parse(t); }catch(x){}
        if(!(j && j.ok)){ btn.disabled = false; btn.textContent = '네, 반영합니다';
          er.textContent = '설정 저장 실패: ' + ((j && j.reason) || '응답 오류'); return; }
        cfg.emps = emps;
        applyRows();
      })
      ['catch'](function(){ btn.disabled = false; btn.textContent = '네, 반영합니다';
        er.textContent = '설정 저장 실패 · 인터넷 연결을 확인해 주세요'; });
  }

  function applyRows(){
    var R = (window.__wvActiveRows ? window.__wvActiveRows() : window.__wvRows), changed = false;
    if(R && R.length > 3){
      var head = R[1].map(function(x){ return String(x).trim(); });
      var nc = head.indexOf('성명'); if(nc < 0) nc = 1;
      for(var r = 3; r < R.length; r++){
        if(String(R[r][nc]).trim() === orig.name){
          R[r][nc] = F.name;
          R[r][nc + 1] = F.title;
          R[r][nc + 2] = F.home;
          changed = true; break;
        }
      }
      if(changed){ try{ render(R); if(window.__wvSyncEdit) window.__wvSyncEdit(R); }catch(x){} }
    }
    if(!changed){ finish(false, '이번 달 표에 해당 직원이 없어 표는 그대로입니다'); return; }
    saveRev();
  }

  function saveRev(){
    var sel = document.getElementById('monthSel');
    var month = sel ? sel.value : '';
    var summary = orig.name + ' 정보 수정 — ' + diffLines().join(' · ');
    if(!window.__wvPw){ finish(false, '관리자 인증이 없어 (수정N) 시트는 만들지 못했습니다'); return; }
    fetch(URL_, { method:'POST', mode:'no-cors',
      headers:{ 'Content-Type':'text/plain;charset=utf-8' },
      body: JSON.stringify({ token:TOKEN, action:'edit', pw:window.__wvPw,
        month:month, rows:window.__wvRows, auto:summary, memo:'' }) })
      .then(function(){ finish(true, ''); })
      ['catch'](function(){ finish(false, '(수정N) 시트 저장에 실패했습니다'); });
  }

  function finish(rev, note){
    paint(shell('완료',
      '<div class="wvA-ok"><b>' + esc(F.name) + '</b> 정보를 반영했습니다.<br><br>'
      + '· 구글시트 <b>설정</b> 탭 저장 완료 — 생성기를 열면 자동 반영됩니다<br>'
      + '· 이번 달 스케줄 표 갱신 완료<br>'
      + (rev ? '· 구글시트 <b>(수정N)</b> 탭에 기록했습니다<br>' : '')
      + (note ? '<br><b style="color:#a86400">' + esc(note) + '</b>' : '')
      + '</div>'
      + '<div class="wvA-bar"><button class="pri" id="wvEeDone">확인</button></div>'));
    document.getElementById('wvEeDone').onclick = function(){
      close();
      if(rev) setTimeout(function(){ location.reload(); }, 400);
    };
  }

  /* 시작 */
  function start(){
    if(!isAdmin()){ alert('관리자 모드에서만 사용할 수 있습니다.'); return; }
    if(!URL_){ alert('시트 주소가 없습니다'); return; }
    paint(shell('불러오는 중', '<p class="wvA-d">직원 설정을 불러오는 중입니다…</p>'));
    fetch(URL_ + '?mode=cfg&t=' + Date.now(), {cache:'no-store'})
      .then(function(r){ return r.text(); })
      .then(function(t){
        var j = null; try{ j = JSON.parse(t); }catch(x){}
        if(!j || !j.ok){
          paint(shell('오류', '<p class="wvA-d" style="color:#c5221f">시트 설정을 읽지 못했습니다: '
            + esc((j && j.reason) || '응답 오류') + '</p>'
            + '<div class="wvA-bar"><button class="pri" id="wvEeDone">닫기</button></div>'));
          document.getElementById('wvEeDone').onclick = close; return;
        }
        cfg = { stores:j.stores || [], emps:j.emps || [] };
        pick();
      })
      ['catch'](function(){
        paint(shell('오류', '<p class="wvA-d" style="color:#c5221f">시트에 연결하지 못했습니다</p>'
          + '<div class="wvA-bar"><button class="pri" id="wvEeDone">닫기</button></div>'));
        document.getElementById('wvEeDone').onclick = close;
      });
  }

  function mountBtn(){
    var ex = document.getElementById('wvEeBtn');
    if(ex){ ex.style.display = isAdmin() ? '' : 'none'; return; }
    var add = document.getElementById('wvAeBtn');
    if(!add) return;
    var b = document.createElement('button');
    b.id = 'wvEeBtn'; b.textContent = '직원 수정';
    b.style.cssText = 'font-size:12px;padding:5px 10px;border-radius:8px;border:1px solid ' + NAVY
      + ';background:#fff;color:' + NAVY + ';cursor:pointer;margin-left:6px;font-weight:700';
    b.style.display = isAdmin() ? '' : 'none';
    b.onclick = start;
    add.parentNode.insertBefore(b, add.nextSibling);
  }
  function loop(){ mountBtn(); setTimeout(loop, 1500); }
  setTimeout(loop, 2000);
})();
</script>


<script>
/* ===== 직원 추가 갈래 (신규 / 기존) =====
   기존 [직원 추가] 버튼을 눌렀을 때 먼저 갈래를 묻고,
   신규는 원래 마법사로, 기존은 시트 명단에서 골라 이번 달 표에 넣는다. */
(function(){
  if(window.__wvAddPick) return; window.__wvAddPick = true;
  var URL_ = (typeof WEBAPP_URL !== 'undefined' && WEBAPP_URL) ? WEBAPP_URL : '';
  var NAVY = '#2b2d42';
  var origHandler = null;
  var cfg = null, target = null;

  function esc(s){ return String(s == null ? '' : s).replace(/[&<>"]/g, function(c){
    return ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'})[c]; }); }
  function isAdmin(){ return !!window.__wvPw || document.body.classList.contains('wvEditing'); }
  function rowsNow(){ var r = window.__wvActiveRows ? window.__wvActiveRows() : null; return (r && r.length) ? r : window.__wvRows; }

  function ov(){
    var o = document.getElementById('wvAeOv');
    if(!o){ o = document.createElement('div'); o.id = 'wvAeOv';
      o.addEventListener('click', function(e){ if(e.target === o) o.style.display='none'; });
      document.body.appendChild(o); }
    if(window.__wvWizCss) window.__wvWizCss();
    o.style.display = 'flex'; return o;
  }
  function close(){ var o = document.getElementById('wvAeOv'); if(o) o.style.display = 'none'; }
  function shell(step, inner){
    return '<div class="wvA"><div class="wvA-top"><div><b>직원 추가</b>'
      + '<div class="step">' + esc(step) + '</div></div>'
      + '<button class="wvA-x" id="wvApX">✕</button></div>'
      + '<div class="wvA-b">' + inner + '</div></div>';
  }
  function paint(html){ var o = ov(); o.innerHTML = html;
    var x = document.getElementById('wvApX'); if(x) x.onclick = close; }
  function opt(id, title, desc){
    return '<button id="' + id + '"><b>' + esc(title) + '</b><span>' + esc(desc) + '</span></button>';
  }

  function meta(){
    var R = rowsNow();
    var h = R[1] || [];
    var day = [];
    for(var c = 0; c < h.length; c++) if(/^\d{1,2}$/.test(String(h[c]).trim())) day.push(c);
    var sum = {};
    for(var c2 = 0; c2 < h.length; c2++){
      var k = String(h[c2]).trim();
      if(k === '휴무' || k === '훈련' || k === '병가') sum[k] = c2;
    }
    return { R:R, day:day, sum:sum, name:1, title:2, home:3, co:0, w:h.length };
  }
  function namesInTable(){
    var m = meta(), out = [];
    for(var r = 3; r < m.R.length; r++){
      var n = String(m.R[r][m.name] || '').trim();
      if(n) out.push(n);
    }
    return out;
  }
  var OFFWORD = ['전휴무','휴가','병가','훈련','출장','휴무'];
  function isOff(v){
    v = String(v || '').trim();
    if(!v) return true;
    for(var i = 0; i < OFFWORD.length; i++) if(v.indexOf(OFFWORD[i]) >= 0) return true;
    return false;
  }

  function chooser(){
    if(!isAdmin()){ alert('관리자 모드에서만 사용할 수 있습니다.'); return; }
    paint(shell('1 / 2 · 어떤 직원인가요',
      '<p class="wvA-q">누구를 넣을까요?</p>'
      + '<p class="wvA-d">이번 달 표에 빠져 있는 사람을 넣습니다.</p>'
      + '<div class="wvA-pick">'
      + opt('wvApNew', '신규 직원 추가', '아직 시트에 없는 사람입니다. 정보를 새로 입력합니다')
      + opt('wvApOld', '기존 직원 추가', '시트에 이미 있는 사람을 이번 달 표에만 넣습니다')
      + '</div>'));
    document.getElementById('wvApNew').onclick = function(){
      close();
      if(window.__wvWatchNewRow) window.__wvWatchNewRow();
      setTimeout(function(){ if(origHandler) origHandler.call(document.getElementById('wvAeBtn')); }, 80);
    };
    document.getElementById('wvApOld').onclick = loadCfg;
  }

  function loadCfg(){
    paint(shell('불러오는 중', '<p class="wvA-d">시트에서 직원 명단을 불러오는 중입니다…</p>'));
    fetch(URL_ + '?mode=cfg&t=' + Date.now(), {cache:'no-store'})
      .then(function(r){ return r.text(); })
      .then(function(t){
        var j = null; try{ j = JSON.parse(t); }catch(x){}
        if(!j || !j.ok) return err('시트 설정을 읽지 못했습니다: ' + ((j && j.reason) || '응답 오류'));
        cfg = j;
        var have = namesInTable();
        var left = (j.emps || []).filter(function(e){ return have.indexOf(e.name) < 0; });
        if(!left.length) return err('시트의 직원이 이번 달 표에 모두 들어 있습니다.');
        paint(shell('2 / 2 · 직원 선택',
          '<p class="wvA-q">누구를 넣을까요?</p>'
          + '<p class="wvA-d">이번 달 표에 아직 없는 사람만 나옵니다 (' + left.length + '명).</p>'
          + '<div class="wvA-pick" style="max-height:52vh;overflow:auto">'
          + left.map(function(e, i){
              return '<button data-i="' + i + '"><b>' + esc(e.name) + '</b><span>'
                + esc(e.title + ' · ' + e.home + ' · 휴무 ' + (e.offN == null ? 10 : e.offN) + '일')
                + '</span></button>';
            }).join('')
          + '</div>'));
        document.getElementById('wvAeOv').querySelectorAll('.wvA-pick button').forEach(function(b){
          b.onclick = function(){ target = left[+b.getAttribute('data-i')]; howFill(); };
        });
      })
      ['catch'](function(){ err('시트에 연결하지 못했습니다'); });
  }

  function err(msg){
    paint(shell('오류', '<p class="wvA-d" style="color:#c5221f">' + esc(msg) + '</p>'
      + '<div class="wvA-bar"><button class="pri" id="wvApDone">닫기</button></div>'));
    document.getElementById('wvApDone').onclick = close;
  }

  function howFill(){
    paint(shell('스케줄 채우기',
      '<p class="wvA-q">' + esc(target.name) + ' 님의 근무를 어떻게 채울까요?</p>'
      + '<p class="wvA-d">어느 쪽이든 추가한 뒤 칸을 눌러 바꿀 수 있습니다.</p>'
      + '<div class="wvA-pick">'
      + opt('wvApAuto', '소속 매장으로 자동', esc(target.home) + ' 기준으로 채우고 휴무 ' + (target.offN == null ? 10 : target.offN) + '일을 맞춥니다')
      + opt('wvApCopy', '다른 직원 근무 따라가기', '표에 있는 사람을 골라 그 근무를 복사합니다')
      + opt('wvApBlank', '빈 칸으로 추가', '전부 휴무 상태로 넣고 직접 채웁니다')
      + '</div>'));
    document.getElementById('wvApAuto').onclick = function(){ build('auto', null); };
    document.getElementById('wvApBlank').onclick = function(){ build('blank', null); };
    document.getElementById('wvApCopy').onclick = pickMate;
  }

  function pickMate(){
    var m = meta(), list = [];
    for(var r = 3; r < m.R.length; r++){
      var n = String(m.R[r][m.name] || '').trim();
      if(n) list.push({ r:r, n:n, t:m.R[r][m.title], h:m.R[r][m.home] });
    }
    paint(shell('따라갈 직원',
      '<p class="wvA-q">누구 근무를 따라갈까요?</p>'
      + '<div class="wvA-pick" style="max-height:52vh;overflow:auto">'
      + list.map(function(x, i){
          return '<button data-i="' + i + '"><b>' + esc(x.n) + '</b><span>'
            + esc((x.t || '') + ' · ' + (x.h || '')) + '</span></button>';
        }).join('')
      + '</div>'));
    document.getElementById('wvAeOv').querySelectorAll('.wvA-pick button').forEach(function(b){
      b.onclick = function(){ build('copy', list[+b.getAttribute('data-i')].r); };
    });
  }

  function build(mode, mateRow){
    var m = meta();
    var goal = (target.offN == null ? 10 : target.offN);
    var row = [];
    for(var i = 0; i < m.w; i++) row.push('');
    row[m.co] = m.R[3] ? m.R[3][m.co] : '위베이프';
    row[m.name] = target.name;
    row[m.title] = target.title;
    row[m.home] = target.home;

    var d, c, note = '';
    if(mode === 'copy'){
      for(d = 0; d < m.day.length; d++){
        c = m.day[d];
        var v = String(m.R[mateRow][c] || '').trim();
        row[c] = isOff(v) ? '' : v;
      }
      note = '근무 복사 ' + m.day.filter(function(cc){ return row[cc]; }).length + '일';
    } else if(mode === 'auto'){
      var base = (target.home && target.home !== '순환') ? target.home : null;
      for(d = 0; d < m.day.length; d++){
        c = m.day[d];
        if(base) row[c] = base;
        else {
          var pick = '';
          for(var r2 = 3; r2 < m.R.length && !pick; r2++){
            var vv = String(m.R[r2][c] || '').trim();
            if(vv && !isOff(vv)) pick = vv;
          }
          row[c] = pick;
        }
      }
      note = (base ? base : '순환') + ' 기준으로 채움';
    } else {
      note = '빈 칸으로 추가';
    }

    if(mode !== 'blank'){
      var work = [], off = [];
      for(d = 0; d < m.day.length; d++){
        c = m.day[d];
        (row[c] ? work : off).push(c);
      }
      var gap = off.length - goal;   /* 양수 = 휴무가 많다 → 근무를 채운다 */
      if(gap > 0){
        var filled = 0;
        for(var k = 0; k < off.length && filled < gap; k++){
          var cc = off[k], v2 = '';
          /* ① 다른 팀장이 그날 나가는 매장 ② 아무나 나가는 매장 ③ 본인 소속 */
          for(var r2 = 3; r2 < m.R.length && !v2; r2++){
            if(String(m.R[r2][m.title] || '').indexOf('팀장') < 0) continue;
            var vt = String(m.R[r2][cc] || '').trim();
            if(vt && !isOff(vt)) v2 = vt;
          }
          for(var r3 = 3; r3 < m.R.length && !v2; r3++){
            var vv2 = String(m.R[r3][cc] || '').trim();
            if(vv2 && !isOff(vv2)) v2 = vv2;
          }
          if(!v2 && target.home && target.home !== '순환') v2 = target.home;
          if(v2){ row[cc] = v2; filled++; }
        }
      } else if(gap < 0){
        var cut = -gap;
        var step = Math.max(1, Math.floor(work.length / cut));
        for(var k2 = 0; k2 < cut && k2 * step < work.length; k2++) row[work[k2 * step]] = '';
      }
    }

    var offN = 0;
    for(d = 0; d < m.day.length; d++) if(!row[m.day[d]]) offN++;
    if(m.sum['휴무'] != null) row[m.sum['휴무']] = String(offN);
    if(m.sum['훈련'] != null) row[m.sum['훈련']] = '0';
    if(m.sum['병가'] != null) row[m.sum['병가']] = '0';

    m.R.push(row);
    try{ render(m.R); if(window.__wvSyncEdit) window.__wvSyncEdit(m.R); }catch(x){}
    if(window.__wvAutoPT) try{ window.__wvAutoPT(m.R.length - 1); }catch(x){}

    var synced = !!(window.__wvSyncEdit && document.body.classList.contains('wvEditing'));
    paint(shell('완료',
      '<div class="wvA-ok"><b>' + esc(target.name) + '</b> 님을 이번 달 표에 넣었습니다.<br><br>'
      + '· ' + esc(note) + '<br>'
      + '· 휴무 ' + offN + '일 (목표 ' + goal + '일)' + (offN === goal ? '' : ' — 칸을 눌러 맞춰 주세요') + '<br>'
      + '· 시트 설정은 건드리지 않았습니다 (이미 등록된 직원)'
      + '</div>'
      + '<p class="wvA-d" style="margin-top:12px">'
      + (synced
          ? '아래 <b>저장</b>을 눌러야 구글시트에 (수정N) 탭으로 기록됩니다.'
          : '오른쪽 위 설정 아이콘 → <b>관리자 모드</b>로 들어가 <b>저장</b>을 눌러야 구글시트에 남습니다.')
      + '</p>'
      + '<div class="wvA-bar"><button class="pri" id="wvApDone">확인</button></div>'));
    document.getElementById('wvApDone').onclick = function(){
      close();
      if(window.__wvAskStart) setTimeout(function(){ window.__wvAskStart(m.R.length - 1, target.name, goal); }, 150);
    };
  }

  function hook(){
    var b = document.getElementById('wvAeBtn');
    if(b && !b.__wvPicked){
      origHandler = b.onclick;
      b.onclick = function(){ chooser(); };
      b.__wvPicked = true;
    }
    setTimeout(hook, 1500);
  }
  setTimeout(hook, 2500);
})();
</script>


<script>
/* ===== 제외 블록 (검정) =====
   중간 합류한 직원의 '근무 시작일' 이전 날짜를 검정으로 막고,
   근무일수·휴무 어느 쪽 합계에도 넣지 않는다. */
(function(){
  if(window.__wvExcl) return; window.__wvExcl = true;
  var MARK = '제외';
  var pollFrom = -1;

  function esc(s){ return String(s == null ? '' : s).replace(/[&<>"]/g, function(c){
    return ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'})[c]; }); }
  function rowsNow(){ var r = window.__wvActiveRows ? window.__wvActiveRows() : null;
    return (r && r.length) ? r : window.__wvRows; }

  function css(){
    if(document.getElementById('wvXcCss')) return;
    var st = document.createElement('style'); st.id = 'wvXcCss';
    st.textContent = 'td.wvXc{background:#23262e !important;color:transparent !important;'
      + 'background-image:repeating-linear-gradient(45deg,rgba(255,255,255,.06) 0 4px,transparent 4px 8px) !important;}'
      + 'td.wvXc *{color:transparent !important}';
    document.head.appendChild(st);
  }

  function paint(){
    css();
    var tds = document.querySelectorAll('table td');
    for(var i = 0; i < tds.length; i++){
      var on = String(tds[i].textContent || '').trim() === MARK;
      if(on !== tds[i].classList.contains('wvXc')) tds[i].classList.toggle('wvXc', on);
    }
  }

  function meta(){
    var R = rowsNow(); var h = R[1] || []; var day = [], sum = {};
    for(var c = 0; c < h.length; c++){
      var k = String(h[c]).trim();
      if(/^\d{1,2}$/.test(k)) day.push(c);
      if(k === '휴무' || k === '훈련' || k === '병가') sum[k] = c;
    }
    return { R:R, day:day, sum:sum, name:1, title:2, home:3 };
  }
  var OFFWORD = ['전휴무','휴가','병가','훈련','출장','휴무'];
  function isOff(v){
    v = String(v || '').trim();
    if(!v || v === MARK) return true;
    for(var i = 0; i < OFFWORD.length; i++) if(v.indexOf(OFFWORD[i]) >= 0) return true;
    return false;
  }

  function recount(){
    var m = meta(), touched = 0;
    for(var r = 3; r < m.R.length; r++){
      var has = false, off = 0;
      for(var d = 0; d < m.day.length; d++){
        var v = String(m.R[r][m.day[d]] || '').trim();
        if(v === MARK){ has = true; continue; }
        if(!v) off++;
      }
      if(has && m.sum['휴무'] != null && String(m.R[r][m.sum['휴무']]) !== String(off)){
        m.R[r][m.sum['휴무']] = String(off); touched++;
      }
    }
    return touched;
  }

  function ov(){
    var o = document.getElementById('wvAeOv');
    if(!o){ o = document.createElement('div'); o.id = 'wvAeOv';
      o.addEventListener('click', function(e){ if(e.target === o) o.style.display='none'; });
      document.body.appendChild(o); }
    if(window.__wvWizCss) window.__wvWizCss();
    o.style.display = 'flex'; return o;
  }
  function close(){ var o = document.getElementById('wvAeOv'); if(o) o.style.display = 'none'; }
  function shell(step, inner){
    return '<div class="wvA"><div class="wvA-top"><div><b>근무 시작일</b>'
      + '<div class="step">' + esc(step) + '</div></div>'
      + '<button class="wvA-x" id="wvXcX">✕</button></div>'
      + '<div class="wvA-b">' + inner + '</div></div>';
  }
  function draw(html){ var o = ov(); o.innerHTML = html;
    var x = document.getElementById('wvXcX'); if(x) x.onclick = close; }

  window.__wvAskStart = function(rowIdx, who, goal){
    var m = meta(), total = m.day.length;
    if(goal == null){
      goal = 0;
      var rr = m.R[rowIdx] || [];
      for(var q = 0; q < total; q++){
        var qv = String(rr[m.day[q]] || '').trim();
        if(!qv || qv === MARK) goal++;
      }
    }
    css();
    draw(shell('중간 합류 처리',
      '<p class="wvA-q">' + esc(who) + ' 님은 며칠부터 근무하나요?</p>'
      + '<p class="wvA-d">그 앞 날짜는 <b>검정</b>으로 막고 근무일수·휴무 어느 쪽에도 넣지 않습니다.<br>'
      + '1일부터면 그냥 <b>1</b>을 두고 넘어가세요.</p>'
      + '<div class="wvA-f"><label>시작일</label>'
      + '<input id="wvXcDay" type="number" min="1" max="' + total + '" value="1"></div>'
      + '<p class="wvA-d" id="wvXcHint" style="margin-top:12px"></p>'
      + '<div class="wvA-err" id="wvXcErr"></div>'
      + '<div class="wvA-bar"><button id="wvXcSkip">1일부터 근무</button>'
      + '<button class="pri" id="wvXcOk">적용</button></div>'));
    var inp = document.getElementById('wvXcDay');
    var hint = document.getElementById('wvXcHint');
    function upd(){
      var s = parseInt(inp.value, 10) || 1;
      if(s < 1) s = 1; if(s > total) s = total;
      var remain = total - s + 1;
      var g = Math.round(goal * remain / total);
      hint.innerHTML = s <= 1
        ? '제외 없음 · 휴무 목표 ' + goal + '일'
        : '<b>1~' + (s - 1) + '일 제외 (' + (s - 1) + '일)</b> · 근무 대상 ' + remain + '일 · 휴무 목표 <b>' + g + '일</b>';
    }
    inp.oninput = upd; upd();
    document.getElementById('wvXcSkip').onclick = close;
    document.getElementById('wvXcOk').onclick = function(){
      var s = parseInt(inp.value, 10) || 1;
      if(s < 1 || s > total){ document.getElementById('wvXcErr').textContent = '1~' + total + ' 사이로 입력해 주세요'; return; }
      apply(rowIdx, s, goal, who);
    };
  };

  function apply(rowIdx, start, goal, who){
    var m = meta(), R = m.R, row = R[rowIdx];
    if(!row){ close(); return; }
    var total = m.day.length;
    var remainCols = [], d, c;
    for(d = 0; d < total; d++){
      c = m.day[d];
      if(d + 1 < start) row[c] = MARK;
      else { if(String(row[c]).trim() === MARK) row[c] = ''; remainCols.push(c); }
    }
    var target = Math.round(goal * remainCols.length / total);

    var work = [], off = [];
    for(d = 0; d < remainCols.length; d++) (row[remainCols[d]] ? work : off).push(remainCols[d]);
    var gap = off.length - target;
    if(gap > 0){
      var filled = 0;
      for(var k = 0; k < off.length && filled < gap; k++){
        var cc = off[k], v = '';
        for(var r2 = 3; r2 < R.length && !v; r2++){
          if(r2 === rowIdx) continue;
          if(String(R[r2][m.title] || '').indexOf('팀장') < 0) continue;
          var vt = String(R[r2][cc] || '').trim();
          if(vt && !isOff(vt)) v = vt;
        }
        for(var r3 = 3; r3 < R.length && !v; r3++){
          if(r3 === rowIdx) continue;
          var vv = String(R[r3][cc] || '').trim();
          if(vv && !isOff(vv)) v = vv;
        }
        if(!v && row[m.home] && row[m.home] !== '순환') v = row[m.home];
        if(v){ row[cc] = v; filled++; }
      }
    } else if(gap < 0){
      var cut = -gap, step = Math.max(1, Math.floor(work.length / cut));
      for(var k2 = 0; k2 < cut && k2 * step < work.length; k2++) row[work[k2 * step]] = '';
    }

    var offN = 0, workN = 0;
    for(d = 0; d < remainCols.length; d++) (row[remainCols[d]] ? workN++ : offN++);
    if(m.sum['휴무'] != null) row[m.sum['휴무']] = String(offN);
    recount();
    try{ render(R); if(window.__wvSyncEdit) window.__wvSyncEdit(R); }catch(x){}
    if(window.__wvAutoPT) try{ window.__wvAutoPT(rowIdx); }catch(x){}
    setTimeout(paint, 60);

    draw(shell('완료',
      '<div class="wvA-ok"><b>' + esc(who) + '</b> — ' + start + '일부터 근무<br><br>'
      + (start > 1 ? '· 1~' + (start - 1) + '일 <b>제외</b> (' + (start - 1) + '일) — 합계에서 빠집니다<br>' : '· 제외 없음<br>')
      + '· 근무 ' + workN + '일 · 휴무 ' + offN + '일 (목표 ' + target + '일)'
      + '</div>'
      + '<div class="wvA-bar"><button class="pri" id="wvXcDone">확인</button></div>'));
    document.getElementById('wvXcDone').onclick = close;
  };

  window.__wvWatchNewRow = function(goal){
    var R = rowsNow();
    pollFrom = R ? R.length : -1;
    var tries = 0;
    (function tick(){
      tries++;
      var cur = rowsNow();
      if(cur && pollFrom > 0 && cur.length > pollFrom){
        var idx = cur.length - 1;
        var nm = String(cur[idx][1] || '').trim();
        pollFrom = -1;
        setTimeout(function(){ window.__wvAskStart(idx, nm, goal); }, 900);
        return;
      }
      if(tries < 400) setTimeout(tick, 900);
    })();
  };

  function loop(){
    paint();
    try{ if(recount() > 0){ var R = rowsNow(); render(R); if(window.__wvSyncEdit) window.__wvSyncEdit(R); setTimeout(paint, 60); } }catch(x){}
    setTimeout(loop, 1200);
  }
  setTimeout(loop, 2000);
})();
</script>

<script>
/* ===== 칸 선택 메뉴에 '제외' 넣기 =====
   관리자 편집 모드에서 날짜 칸을 누르면 나오는 목록 맨 끝에
   검정 '제외'를 붙인다. 값은 기존 처리기가 그대로 넣는다. */
(function(){
  if(window.__wvPickExcl) return; window.__wvPickExcl = true;
  var MARK = '제외';

  function css(){
    if(document.getElementById('wvPxCss')) return;
    var st = document.createElement('style'); st.id = 'wvPxCss';
    st.textContent = '#wvPick button.wvPxBtn{background:#23262e !important;color:#fff !important;'
      + 'font-weight:700 !important;border-color:#23262e !important;}'
      + '#wvPick button.wvPxBtn:hover{background:#3a3f4c !important;}'
      + '#wvPick button.wvPtBtn{background:#e8f5ef !important;color:#1f7a5a !important;font-weight:700 !important;border-color:#bfe0d2 !important;}'
      + '#wvPick button.wvSwBtn{background:#fff6e5 !important;color:#8a6100 !important;font-weight:700 !important;border-color:#f0dcae !important;}'
      + '#wvPick button.wvDayBtn{background:#eef3ff !important;color:#22409a !important;font-weight:800 !important;border-color:#c3d0f5 !important;}';
    document.head.appendChild(st);
  }

  var lastTd = null;
  document.addEventListener('click', function(e){
    var td = e.target && e.target.closest ? e.target.closest('td[data-r]') : null;
    if(td) lastTd = td;
  }, true);

  function tick(){
    var p = document.getElementById('wvPick');
    if(p && p.style.display === 'block' && !p.querySelector('.wvPxBtn')){
      css();
      var b = document.createElement('button');
      b.className = 'wvPxBtn';
      b.setAttribute('data-v', MARK);
      b.textContent = '제외 (합계 제외)';
      p.appendChild(b);

      /* 이 사람 근무 전체에 PT 표시 켜고 끄기 */
      if(window.__wvSetPT && lastTd){
        var rIdx = parseInt(lastTd.getAttribute('data-r'), 10);
        var cIdx = parseInt(lastTd.getAttribute('data-c'), 10);
        var cur = String(lastTd.textContent || '');
        var on = cur.indexOf('PT') < 0;

        /* ① 이 날 하루만 바꾸기 */
        if(window.__wvPTCell && cur.trim() && cur.trim() !== MARK){
          var cellPT = cur.indexOf('PT') >= 0;
          var t1 = document.createElement('button');
          t1.className = 'wvDayBtn';
          t1.textContent = cellPT ? '이 날만 풀타임 (PT 떼기)' : '이 날만 PT';
          t1.onclick = function(ev){
            ev.preventDefault(); ev.stopPropagation();
            window.__wvPTCell(rIdx, cIdx, !cellPT);
            p.style.display = 'none';
          };
          p.appendChild(t1);
        }
        var t2 = document.createElement('button');
        t2.className = 'wvPtBtn';
        t2.textContent = on ? '이 사람 전체 PT 표시' : '이 사람 PT 표시 해제';
        t2.onclick = function(ev){
          ev.preventDefault(); ev.stopPropagation();
          window.__wvSetPT(rIdx, on);
          p.style.display = 'none';
        };
        p.appendChild(t2);

        /* 달 중간 풀타임 전환 */
        if(window.__wvAskSwitch && !on){
          var t3 = document.createElement('button');
          t3.className = 'wvSwBtn';
          t3.textContent = '풀타임 전환일 설정';
          t3.onclick = function(ev){
            ev.preventDefault(); ev.stopPropagation();
            p.style.display = 'none';
            window.__wvAskSwitch(rIdx);
          };
          p.appendChild(t3);
        }
      }
    }
    setTimeout(tick, 200);
  }
  setTimeout(tick, 1500);
})();
</script>
<script>
/* ===== PT 표시 =====
   값은 '로데오(PT)' 형태로 넣고, 화면에는 OP·CL처럼 작은 윗첨자로 보여준다.
   교육생 행은 추가할 때 자동으로 전부 붙는다. */
(function(){
  if(window.__wvPT) return; window.__wvPT = true;
  var TAG = '(PT)';

  function rowsNow(){ var r = window.__wvActiveRows ? window.__wvActiveRows() : null;
    return (r && r.length) ? r : window.__wvRows; }

  function css(){
    if(document.getElementById('wvPtCss')) return;
    var st = document.createElement('style'); st.id = 'wvPtCss';
    st.textContent = '.opcl.pt{color:#1f7a5a;font-weight:800}';
    document.head.appendChild(st);
  }

  function paint(){
    css();
    var tds = document.querySelectorAll('table td');
    for(var i = 0; i < tds.length; i++){
      var td = tds[i];
      if(td.querySelector('.opcl.pt')) continue;
      var v = String(td.textContent || '').trim();
      if(v.length > 4 && v.slice(-4) === TAG){
        td.innerHTML = td.innerHTML.replace(/\(PT\)\s*$/, '<span class="opcl pt">PT</span>');
      }
    }
  }

  function meta(){
    var R = rowsNow(); var h = R[1] || []; var day = [];
    for(var c = 0; c < h.length; c++) if(/^\d{1,2}$/.test(String(h[c]).trim())) day.push(c);
    return { R:R, day:day, name:1, title:2 };
  }
  function isBlock(v){
    v = String(v || '').trim();
    if(!v || v === '제외') return true;
    return /전휴무|휴가|병가|훈련|출장|휴무/.test(v);
  }

  window.__wvSetPT = function(rowIdx, on){
    var m = meta(), row = m.R[rowIdx];
    if(!row) return 0;
    var n = 0;
    for(var d = 0; d < m.day.length; d++){
      var c = m.day[d], v = String(row[c] || '').trim();
      if(isBlock(v)) continue;
      var has = v.slice(-4) === TAG;
      if(on && !has && !/\((OP|CL)\)$/.test(v)){ row[c] = v + TAG; n++; }
      else if(!on && has){ row[c] = v.slice(0, -4); n++; }
    }
    if(n){
      try{ render(m.R); if(window.__wvSyncEdit) window.__wvSyncEdit(m.R); }catch(x){}
      setTimeout(paint, 60);
    }
    return n;
  };

  /* 한 칸만 켜고 끄기 */
  window.__wvPTCell = function(r, c, on){
    var m = meta(), row = m.R[r];
    if(!row) return false;
    var v2 = String(row[c] || '').trim();
    if(isBlock(v2)) return false;
    var has = v2.slice(-4) === TAG;
    if(on && !has){ if(/\((OP|CL)\)$/.test(v2)) return false; row[c] = v2 + TAG; }
    else if(!on && has){ row[c] = v2.slice(0, -4); }
    else return false;
    try{ render(m.R); if(window.__wvSyncEdit) window.__wvSyncEdit(m.R); }catch(x){}
    setTimeout(paint, 60);
    return true;
  };

  window.__wvSetPTByName = function(name, on){
    var m = meta();
    for(var r = 3; r < m.R.length; r++)
      if(String(m.R[r][m.name] || '').trim() === name) return window.__wvSetPT(r, on);
    return 0;
  };

  window.__wvAutoPT = function(rowIdx){
    var m = meta(), row = m.R[rowIdx];
    if(!row) return 0;
    var t = String(row[m.title] || '');
    if(t.indexOf('교육') < 0) return 0;
    return window.__wvSetPT(rowIdx, true);
  };

  function loop(){ paint(); setTimeout(loop, 1200); }
  setTimeout(loop, 2200);
})();
</script>
<script>
/* ===== 풀타임 전환일 =====
   달 중간에 교육생이 풀타임으로 바뀌는 경우.
   전환일 앞은 PT 유지, 뒤는 PT 해제 + 구간별 휴무 목표를 다시 잡는다. */
(function(){
  if(window.__wvSwitch) return; window.__wvSwitch = true;
  var TAG = '(PT)', MARK = '제외';

  function esc(s){ return String(s == null ? '' : s).replace(/[&<>"]/g, function(c){
    return ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'})[c]; }); }
  function rowsNow(){ var r = window.__wvActiveRows ? window.__wvActiveRows() : null;
    return (r && r.length) ? r : window.__wvRows; }
  function meta(){
    var R = rowsNow(); var h = R[1] || []; var day = [], sum = {};
    for(var c = 0; c < h.length; c++){
      var k = String(h[c]).trim();
      if(/^\d{1,2}$/.test(k)) day.push(c);
      if(k === '휴무') sum.off = c;
    }
    return { R:R, day:day, sum:sum, name:1, title:2, home:3 };
  }
  function isBlock(v){
    v = String(v || '').trim();
    if(!v || v === MARK) return true;
    return /전휴무|휴가|병가|훈련|출장|휴무/.test(v);
  }

  function ov(){
    var o = document.getElementById('wvAeOv');
    if(!o){ o = document.createElement('div'); o.id = 'wvAeOv';
      o.addEventListener('click', function(e){ if(e.target === o) o.style.display='none'; });
      document.body.appendChild(o); }
    if(window.__wvWizCss) window.__wvWizCss();
    o.style.display = 'flex'; return o;
  }
  function close(){ var o = document.getElementById('wvAeOv'); if(o) o.style.display = 'none'; }
  function draw(step, inner){
    var o = ov();
    o.innerHTML = '<div class="wvA"><div class="wvA-top"><div><b>풀타임 전환</b>'
      + '<div class="step">' + esc(step) + '</div></div>'
      + '<button class="wvA-x" id="wvSwX">✕</button></div>'
      + '<div class="wvA-b">' + inner + '</div></div>';
    document.getElementById('wvSwX').onclick = close;
  }

  window.__wvAskSwitch = function(rowIdx){
    var m = meta(), row = m.R[rowIdx];
    if(!row) return;
    var who = String(row[m.name] || '').trim();
    var total = m.day.length;
    /* 제외가 아닌 실제 대상 날짜 수 */
    var live = 0;
    for(var d = 0; d < total; d++) if(String(row[m.day[d]]).trim() !== MARK) live++;
    draw('구간 나누기',
      '<p class="wvA-q">' + esc(who) + ' 님은 며칠부터 풀타임인가요?</p>'
      + '<p class="wvA-d">그 날부터 <b>PT 표시를 떼고</b> 휴무 목표를 다시 잡습니다.<br>'
      + '앞 구간은 교육생(PT)으로 그대로 둡니다.</p>'
      + '<div class="wvA-f">'
      + '<label>전환일</label><input id="wvSwDay" type="number" min="1" max="' + total + '" value="1">'
      + '<label>교육생 휴무</label><input id="wvSwA" type="number" min="0" max="20" value="8">'
      + '<label>풀타임 휴무</label><input id="wvSwB" type="number" min="0" max="20" value="10">'
      + '</div>'
      + '<p class="wvA-d" id="wvSwHint" style="margin-top:12px"></p>'
      + '<div class="wvA-err" id="wvSwErr"></div>'
      + '<div class="wvA-bar"><button id="wvSwNo">취소</button>'
      + '<button class="pri" id="wvSwOk">적용</button></div>');
    var g = function(id){ return document.getElementById(id); };
    function upd(){
      var s = parseInt(g('wvSwDay').value, 10) || 1;
      var a = parseInt(g('wvSwA').value, 10), b = parseInt(g('wvSwB').value, 10);
      var pre = 0, post = 0;
      for(var d = 0; d < total; d++){
        if(String(row[m.day[d]]).trim() === MARK) continue;
        if(d + 1 < s) pre++; else post++;
      }
      var ta = Math.round(a * pre / total), tb = Math.round(b * post / total);
      g('wvSwHint').innerHTML = '교육생 구간 ' + pre + '일 · 휴무 <b>' + ta + '일</b><br>'
        + '풀타임 구간 ' + post + '일 · 휴무 <b>' + tb + '일</b><br>'
        + '합계 휴무 <b>' + (ta + tb) + '일</b>' + (live !== total ? ' (제외 ' + (total - live) + '일 빼고 계산)' : '');
    }
    ['wvSwDay','wvSwA','wvSwB'].forEach(function(id){ g(id).oninput = upd; });
    upd();
    g('wvSwNo').onclick = close;
    g('wvSwOk').onclick = function(){
      var s = parseInt(g('wvSwDay').value, 10) || 1;
      if(s < 1 || s > total){ g('wvSwErr').textContent = '1~' + total + ' 사이로 입력해 주세요'; return; }
      apply(rowIdx, s, parseInt(g('wvSwA').value, 10), parseInt(g('wvSwB').value, 10), who);
    };
  };

  /* 한 구간의 휴무를 목표에 맞춘다 */
  function balance(R, rowIdx, cols, target, m){
    var row = R[rowIdx], work = [], off = [], i;
    for(i = 0; i < cols.length; i++){
      var v = String(row[cols[i]] || '').trim();
      if(v === MARK) continue;
      (v ? work : off).push(cols[i]);
    }
    var gap = off.length - target;
    if(gap > 0){
      var filled = 0;
      for(i = 0; i < off.length && filled < gap; i++){
        var cc = off[i], pick = '';
        for(var r2 = 3; r2 < R.length && !pick; r2++){
          if(r2 === rowIdx) continue;
          var vv = String(R[r2][cc] || '').trim();
          if(vv && !isBlock(vv)) pick = vv.replace(/\((OP|CL|PT)\)$/, '');
        }
        if(!pick && row[m.home] && row[m.home] !== '순환') pick = row[m.home];
        if(pick){ row[cc] = pick; filled++; }
      }
    } else if(gap < 0){
      var cut = -gap, step = Math.max(1, Math.floor(work.length / cut));
      for(i = 0; i < cut && i * step < work.length; i++) row[work[i * step]] = '';
    }
  }

  function apply(rowIdx, start, offA, offB, who){
    var m = meta(), R = m.R, row = R[rowIdx], total = m.day.length;
    var pre = [], post = [], d, c;
    for(d = 0; d < total; d++){
      c = m.day[d];
      if(String(row[c]).trim() === MARK) continue;
      (d + 1 < start ? pre : post).push(c);
    }
    var ta = Math.round(offA * pre.length / total);
    var tb = Math.round(offB * post.length / total);
    balance(R, rowIdx, pre, ta, m);
    balance(R, rowIdx, post, tb, m);
    /* 앞 구간 PT 붙이고, 뒤 구간 PT 뗀다 */
    var i, v;
    for(i = 0; i < pre.length; i++){
      v = String(row[pre[i]] || '').trim();
      if(!isBlock(v) && v.slice(-4) !== TAG && !/\((OP|CL)\)$/.test(v)) row[pre[i]] = v + TAG;
    }
    for(i = 0; i < post.length; i++){
      v = String(row[post[i]] || '').trim();
      if(v.slice(-4) === TAG) row[post[i]] = v.slice(0, -4);
    }
    /* 휴무 칸 다시 세기 (제외 제외) */
    var offN = 0, workN = 0;
    for(d = 0; d < total; d++){
      v = String(row[m.day[d]] || '').trim();
      if(v === MARK) continue;
      (v ? workN++ : offN++);
    }
    if(m.sum.off != null) row[m.sum.off] = String(offN);
    try{ render(R); if(window.__wvSyncEdit) window.__wvSyncEdit(R); }catch(x){}

    draw('완료',
      '<div class="wvA-ok"><b>' + esc(who) + '</b> — ' + start + '일부터 풀타임<br><br>'
      + '· 1~' + (start - 1) + '일 교육생 <b>PT 유지</b> · 휴무 ' + ta + '일<br>'
      + '· ' + start + '일부터 <b>PT 해제</b> · 휴무 ' + tb + '일<br>'
      + '· 이번 달 근무 ' + workN + '일 · 휴무 ' + offN + '일'
      + '</div>'
      + '<p class="wvA-d" style="margin-top:12px">시트 설정(직책·근무형태·월 휴무)은 <b>직원 수정</b>에서 따로 바꿔 주세요.<br>'
      + '이 화면은 이번 달 표만 고칩니다.</p>'
      + '<div class="wvA-bar"><button class="pri" id="wvSwDone">확인</button></div>');
    document.getElementById('wvSwDone').onclick = close;
  }
})();
</script>
<script>
/* ===== 매장별 보기 (뷰어) =====
   매장 하나를 골라 한 달 근무 인력을 달력으로 본다. 직원 누구나 볼 수 있다. */
(function(){
  if(window.__wvStoreCal) return; window.__wvStoreCal = true;
  function esc(s){ return String(s == null ? '' : s).replace(/[&<>"]/g, function(c){
    return ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'})[c]; }); }
  function rowsNow(){ var r = window.__wvActiveRows ? window.__wvActiveRows() : null;
    return (r && r.length) ? r : window.__wvRows; }
  function base(v){ return String(v || '').replace(/\((OP|CL|PT)\)$/, '').trim(); }
  function tail(v){
    v = String(v || '');
    if(/\(OP\)$/.test(v)) return 'OP';
    if(/\(CL\)$/.test(v)) return 'CL';
    if(/\(PT\)$/.test(v)) return 'PT';
    return '';
  }
  var OFF = /^(전휴무|휴가|병가|훈련|출장|제외|순환)$/;

  function css(){
    if(document.getElementById('wvStCss')) return;
    var st = document.createElement('style'); st.id = 'wvStCss';
    st.textContent = [
      '#wvStBtn{border:1px solid #dcdde5;background:#fff;color:#4a4b57;padding:3px 9px;font-size:12px;font-weight:700;border-radius:8px;cursor:pointer;margin-left:6px}',
      '#wvStOv{position:fixed;inset:0;background:rgba(10,12,25,.6);z-index:100005;display:none;align-items:center;justify-content:center;padding:14px}',
      '.wvStPick{display:grid;grid-template-columns:repeat(auto-fit,minmax(96px,1fr));gap:8px;margin-top:6px}',
      '.wvStPick button{padding:11px 8px;border:1px solid #dcdde5;border-radius:10px;background:#fff;font-size:13px;font-weight:700;color:#2b2d42;cursor:pointer}',
      '.wvStPick button:hover{border-color:#c9a227;background:#fffdf5}',
      '.wvStSum{font-size:12px;color:#8a8f9c;margin:2px 0 10px}',
      '.wvC .tg{font-size:9px;font-weight:800;color:#1f7a5a;margin-left:2px}',
      '.wvC .r.on{background:#eef3ff}'
    ].join('');
    document.head.appendChild(st);
  }

  function ov(){
    var o = document.getElementById('wvStOv');
    if(!o){ o = document.createElement('div'); o.id = 'wvStOv';
      o.addEventListener('click', function(e){ if(e.target === o) o.style.display = 'none'; });
      document.body.appendChild(o); }
    css(); o.style.display = 'flex'; return o;
  }
  function close(){ var o = document.getElementById('wvStOv'); if(o) o.style.display = 'none'; }
  function card(title, sub, body){
    var o = ov();
    o.innerHTML = '<div class="wvMcCard" onclick="event.stopPropagation()">'
      + '<div class="wvMcHead"><b>' + esc(title) + '</b>'
      + '<span style="flex:1"></span><button class="wvMcX" id="wvStX">✕</button></div>'
      + (sub ? '<div class="wvStSum">' + sub + '</div>' : '')
      + body + '</div>';
    document.getElementById('wvStX').onclick = close;
  }

  function meta(){
    var R = rowsNow(); var h = R[1] || []; var day = [];
    for(var c = 0; c < h.length; c++) if(/^\d{1,2}$/.test(String(h[c]).trim())) day.push(c);
    return { R:R, day:day, name:1 };
  }
  function storeList(){
    var m = meta(), set = {}, out = [];
    for(var r = 3; r < m.R.length; r++)
      for(var d = 0; d < m.day.length; d++){
        var b = base(m.R[r][m.day[d]]);
        if(b && !OFF.test(b) && !set[b]){ set[b] = 1; out.push(b); }
      }
    return out.sort();
  }
  function ym(){
    var s = document.getElementById('monthSel');
    var p = (s ? String(s.value) : '').split('-');
    if(p.length === 2) return { y:+p[0], m:+p[1] };
    var d = new Date(); return { y:d.getFullYear(), m:d.getMonth() + 1 };
  }

  function pick(){
    var list = storeList();
    if(!list.length){ card('매장별 보기', '', '<p class="wvStSum">스케줄을 먼저 불러온 뒤 이용해 주세요.</p>'); return; }
    card('매장별 보기', '보고 싶은 매장을 고르세요',
      '<div class="wvStPick">' + list.map(function(n){
        return '<button data-n="' + esc(n) + '">' + esc(n) + '</button>'; }).join('') + '</div>');
    document.getElementById('wvStOv').querySelectorAll('.wvStPick button').forEach(function(b){
      b.onclick = function(){ show(b.getAttribute('data-n')); };
    });
  }

  function show(store){
    var m = meta(), t = ym(), nD = m.day.length;
    var first = new Date(t.y, t.m - 1, 1).getDay();
    var html = '<div class="wvDow">'
      + ['일','월','화','수','목','금','토'].map(function(w, i){
          return '<div class="' + (i === 0 ? 'sun' : i === 6 ? 'sat' : '') + '">' + w + '</div>'; }).join('')
      + '</div><div class="wvG">';
    for(var i = 0; i < first; i++) html += '<div class="wvC e"></div>';
    var man = 0, empty = 0, maxN = 0;
    for(var d = 0; d < nD; d++){
      var c = m.day[d], who = [];
      for(var r = 3; r < m.R.length; r++){
        var v = String(m.R[r][c] || '').trim();
        if(base(v) !== store) continue;
        who.push({ n: String(m.R[r][m.name] || '').trim(), t: tail(v) });
      }
      man += who.length;
      if(!who.length) empty++;
      if(who.length > maxN) maxN = who.length;
      var dow = new Date(t.y, t.m - 1, d + 1).getDay();
      html += '<div class="wvC' + (dow === 0 ? ' sun' : dow === 6 ? ' sat' : '') + '">'
        + '<span class="d">' + (d + 1) + '</span>'
        + who.map(function(x){
            return '<div class="r on"><span class="nm">' + esc(x.n) + '</span>'
              + (x.t ? '<span class="tg">' + x.t + '</span>' : '') + '</div>'; }).join('')
        + '</div>';
    }
    html += '</div>';
    var sub = t.y + '년 ' + t.m + '월 · 연인원 <b>' + man + '명</b> · 하루 최대 ' + maxN + '명'
      + (empty ? ' · <b style="color:#e5484d">아무도 없는 날 ' + empty + '일</b>' : ' · 공백 없음');
    card(store, sub, html + '<div style="margin-top:12px"><button class="wvMcTab" id="wvStBack">다른 매장 보기</button></div>');
    document.getElementById('wvStBack').onclick = pick;
  }
  window.__wvShowStore = show;

  function mount(){
    if(!document.getElementById('wvStBtn')){
      var mc = document.getElementById('wvMc');
      if(mc){
        css();
        var b = document.createElement('button');
        b.id = 'wvStBtn'; b.textContent = '매장별 보기';
        b.onclick = pick;
        mc.parentNode.insertBefore(b, mc.nextSibling);
      }
    }
    setTimeout(mount, 1500);
  }
  setTimeout(mount, 1800);

  document.addEventListener('dblclick', function(e){
    var td = e.target && e.target.closest ? e.target.closest('td') : null;
    if(!td) return;
    var b = base(td.textContent);
    if(!b || OFF.test(b)) return;
    if(storeList().indexOf(b) < 0) return;
    e.preventDefault();
    show(b);
  }, true);
})();
</script>

      '.wvHsAcc.open .wvHsAccH{background:#f7f8fb}',
      '.wvHsPeek{font-size:11.5px;color:#9a9ba6;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:44%}',
      '.wvHsAccB{max-height:0;overflow:hidden;transition:max-height .32s cubic-bezier(.22,1,.36,1)}',
      '.wvHsAccB .pad{padding:4px 12px 12px}',
      '.wvHsEmpty{padding:22px 4px;text-align:center;color:#9a9ba6;font-size:12.5px}',
      '@media(max-width:600px){.wvHsPn{flex-basis:46px;font-size:12px}.wvHsC{font-size:11px}.wvHsPeek{display:none}}',
      '#wvNotice{cursor:pointer;transition:filter .2s ease}',
      '#wvNotice:hover{filter:brightness(.96)}'
    ].join('');
    document.head.appendChild(st);
  }

  /* ── 변경 문구 쪼개기 ── */
  function parse(s){
    return String(s || '').split('·').map(function(x){ return x.trim(); })
      .filter(function(x){ return x; })
      .map(function(x){
        var m = /^(\d+)일\s+(\S+)\s+(.+?)→(.+)$/.exec(x);
        return m ? { d:+m[1], n:m[2], a:m[3].trim(), b:m[4].trim() } : { raw:x };
      });
  }
  function kind(a, b){
    if(a === '제외' || b === '제외') return 'ex';
    if(a === '휴무') return 'add';
    if(b === '휴무') return 'off';
    return 'mv';
  }
  function group(auto){
    var items = parse(auto), g = {}, order = [], loose = [];
    items.forEach(function(x){
      if(!x.n){ loose.push(x.raw); return; }
      if(!g[x.n]){ g[x.n] = []; order.push(x.n); }
      g[x.n].push(x);
    });
    var fresh = order.filter(function(n){
      var L = g[n];
      if(L.length < 12) return false;
      var f = L.filter(function(x){ return x.a === '휴무'; }).length;
      return f / L.length >= 0.9;
    });
    return { items:items, g:g, order:order, loose:loose, fresh:fresh };
  }
  function bodyHtml(auto){
    var q = group(auto), html = '';
    if(q.fresh.length) html += '<div class="wvHsFresh">＋ 신규 직원 추가 (' + q.fresh.map(esc).join(', ') + ')</div>';
    q.order.filter(function(n){ return q.fresh.indexOf(n) < 0; }).forEach(function(n){
      html += '<div class="wvHsRow"><div class="wvHsPn">' + esc(n) + '</div><div class="wvHsCs">'
        + q.g[n].sort(function(p, r){ return p.d - r.d; }).map(function(x){
            return '<span class="wvHsC ' + kind(x.a, x.b) + '"><i>' + x.d + '일</i>'
              + esc(x.a) + '→' + esc(x.b) + '</span>';
          }).join('') + '</div></div>';
    });
    if(q.loose.length){
      html += '<div class="wvHsRow"><div class="wvHsPn"></div><div class="wvHsCs">'
        + q.loose.map(function(x){ return '<span class="wvHsC mv">' + esc(x) + '</span>'; }).join('')
        + '</div></div>';
    }
    return html;
  }
  function peek(auto){
    var q = group(auto);
    if(q.fresh.length) return '신규 ' + q.fresh.join(', ');
    if(!q.order.length) return '';
    return q.order.slice(0, 2).join(', ') + (q.order.length > 2 ? ' 외 ' + (q.order.length - 2) + '명' : '');
  }

  /* ── 팝업 ── */
  function ov(){
    var o = document.getElementById('wvHsOv');
    if(o) return o;
    css();
    o = document.createElement('div'); o.id = 'wvHsOv';
    o.addEventListener('click', function(e){ if(e.target === o) close(); });
    document.body.appendChild(o);
    return o;
  }
  function open(){
    var o = ov();
    o.style.display = 'flex';
    setTimeout(function(){ o.classList.add('on'); }, 10);
  }
  function close(){
    var o = document.getElementById('wvHsOv');
    if(!o) return;
    o.classList.remove('on');
    setTimeout(function(){ o.style.display = 'none'; }, 220);
  }
  document.addEventListener('keydown', function(e){ if(e.key === 'Escape') close(); });

  function shell(inner){
    var o = ov();
    o.innerHTML = '<div class="wvHsCard" onclick="event.stopPropagation()">'
      + '<div class="wvHsTop"><b>변경 이력</b><span class="sub" id="wvHsSub"></span>'
      + '<button class="wvHsX" id="wvHsX">✕</button></div>'
      + '<div class="wvHsBody" id="wvHsBody">' + inner + '</div></div>';
    document.getElementById('wvHsX').onclick = close;
  }

  function draw(list){
    if(!list || !list.length){
      shell('<div class="wvHsEmpty">이번 달은 아직 변경된 내용이 없습니다.</div>');
      document.getElementById('wvHsSub').textContent = month();
      return;
    }
    var top = list[0], rest = list.slice(1);
    var html = '<div class="wvHsNew">'
      + '<div class="wvHsSecTtl">가장 최근 변경</div>'
      + '<div><span class="wvHsWhen">' + esc(top.when) + '</span>'
      + (top.tab ? '<span class="wvHsTag">' + esc(top.tab) + '</span>' : '')
      + '<span class="wvHsTag">' + parse(top.what).length + '건</span></div>'
      + '<div style="margin-top:8px">' + bodyHtml(top.what) + '</div>'
      + (top.memo ? '<div class="wvHsMemo">' + esc(top.memo) + '</div>' : '')
      + '</div>';
    if(rest.length){
      html += '<div class="wvHsMore" id="wvHsMore">'
        + '<button class="wvHsMoreBtn" id="wvHsMoreBtn">이전 이력 ' + rest.length + '건'
        + '<span class="ar">▼</span></button>'
        + '<div class="wvHsList" id="wvHsList">'
        + rest.map(function(r, i){
            return '<div class="wvHsAcc" data-i="' + i + '">'
              + '<div class="wvHsAccH"><span class="wvHsWhen">' + esc(r.when) + '</span>'
              + (r.tab ? '<span class="wvHsTag">' + esc(r.tab) + '</span>' : '')
              + '<span class="wvHsTag">' + parse(r.what).length + '건</span>'
              + '<span class="wvHsPeek">' + esc(peek(r.what)) + '</span>'
              + '<span class="ar">▼</span></div>'
              + '<div class="wvHsAccB"><div class="pad">' + bodyHtml(r.what)
              + (r.memo ? '<div class="wvHsMemo">' + esc(r.memo) + '</div>' : '')
              + '</div></div></div>';
          }).join('')
        + '</div></div>';
    }
    shell(html);
    document.getElementById('wvHsSub').textContent = month() + ' · 전체 ' + list.length + '건';

    var more = document.getElementById('wvHsMore');
    if(more){
      var listEl = document.getElementById('wvHsList');
      function sync(){
        if(more.classList.contains('open')){
          listEl.style.maxHeight = (listEl.scrollHeight + 40) + 'px';
          /* 펼침이 끝나면 제한을 풀어 안쪽을 열어도 잘리지 않게 한다 */
          setTimeout(function(){ if(more.classList.contains('open')) listEl.style.maxHeight = 'none'; }, 360);
        } else {
          listEl.style.maxHeight = listEl.scrollHeight + 'px';
          requestAnimationFrame(function(){ listEl.style.maxHeight = '0px'; });
          setTimeout(function(){ if(!more.classList.contains('open')) listEl.style.maxHeight = '0px'; }, 60);
        }
      }
      document.getElementById('wvHsMoreBtn').onclick = function(){
        more.classList.toggle('open');
        sync();
      };
      listEl.querySelectorAll('.wvHsAcc').forEach(function(acc){
        var b = acc.querySelector('.wvHsAccB');
        acc.querySelector('.wvHsAccH').onclick = function(){
          var on = acc.classList.toggle('open');
          b.style.maxHeight = on ? (b.scrollHeight + 20) + 'px' : '0px';
          if(on) setTimeout(function(){
            if(acc.classList.contains('open')) b.style.maxHeight = 'none';
          }, 340);
        };
      });
    }
  }

  var busy = false, cache = null;
  function load(force){
    var u = url();
    if(!u){ draw(null); return; }
    if(cache && !force){ draw(cache); return; }
    if(busy) return;
    busy = true;
    fetch(u + '?mode=all&t=' + Date.now(), {cache:'no-store'})
      .then(function(r){ return r.text(); })
      .then(function(res0){
        busy = false;
        var j = null; try{ j = JSON.parse(res0); }catch(e){}
        var arr = null;
        if(j && typeof j.notice === 'string'){ try{ arr = JSON.parse(j.notice); }catch(e){} }
        else if(j && Array.isArray(j.notice)) arr = j.notice;
        if(!Array.isArray(arr) || !arr.length){ fallback(); return; }
        var total = arr.length;
        var out = arr.map(function(x, i){
          return {
            what: String((x && x.auto) || '').trim(),
            when: String((x && x.at) || '').trim(),
            memo: String((x && x.memo) || '').trim(),
            tab:  '수정' + (total - i)
          };
        }).filter(function(x){ return x.what || x.memo; });
        if(!out.length){ fallback(); return; }
        cache = out;
        draw(out);
      })['catch'](function(){ busy = false; fallback(); });
  }
  function fallback(){
    var b = document.getElementById('wvNotice');
    var txt = b ? String(b.textContent || '').replace(/^[^가-힣]*변경 안내/, '').trim() : '';
    if(!txt){ draw(null); return; }
    draw([{ what:txt, when:'', memo:'', tab:'' }]);
  }

  window.__wvGoHist = function(){
    css();
    var p = document.getElementById('wvNpop'); if(p) p.style.display = 'none';
    shell('<div class="wvHsEmpty">불러오는 중…</div>');
    open();
    load(false);
  };

  document.addEventListener('click', function(e){
    var n = e.target && e.target.closest ? e.target.closest('#wvNotice') : null;
    if(!n) return;
    e.preventDefault();
    e.stopImmediatePropagation();
    window.__wvGoHist();
  }, true);

  var lastM = '';
  setInterval(function(){
    var m = month();
    if(m && m !== lastM){ lastM = m; cache = null; }
  }, 1500);
  setTimeout(css, 1500);
})();
</script>
</html>
